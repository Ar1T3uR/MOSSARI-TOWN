<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mossari Town</title>
    <!-- Подключаем официальный скрипт Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1a1a24;
            color: #ffffff;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            z-index: 1;
            touch-action: none;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 16px;
            z-index: 10;
        }

        .interactive {
            pointer-events: auto;
        }

        header {
            background: rgba(20, 20, 28, 0.85);
            backdrop-filter: blur(12px);
            padding: 10px 16px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .brand-logo {
            font-weight: 800;
            letter-spacing: 2px;
            font-size: 15px;
            text-transform: uppercase;
        }

        .brand-logo span {
            color: #c5a059;
        }

        .user-info {
            font-size: 12px;
            font-weight: 600;
            color: #c5a059;
            background: rgba(197, 160, 89, 0.15);
            padding: 5px 10px;
            border-radius: 20px;
            border: 1px solid rgba(197, 160, 89, 0.3);
        }

        .bottom-ui {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .sub-menu {
            display: none;
            background: rgba(20, 20, 28, 0.95);
            backdrop-filter: blur(12px);
            padding: 8px;
            border-radius: 16px;
            gap: 8px;
            border: 1px solid rgba(197, 160, 89, 0.3);
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            overflow-x: auto;
            max-width: 100%;
            -webkit-overflow-scrolling: touch;
        }

        .sub-menu.active {
            display: flex;
        }

        .toolbar {
            background: rgba(20, 20, 28, 0.9);
            backdrop-filter: blur(12px);
            padding: 10px 12px;
            border-radius: 20px;
            display: flex;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.08);
            max-width: 100%;
            margin: 0 auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x;
        }

        .toolbar::-webkit-scrollbar, .sub-menu::-webkit-scrollbar {
            display: none;
        }

        .tool-btn {
            background: rgba(255,255,255,0.04);
            border: 2px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 8px 6px;
            flex: 0 0 auto;
            min-width: 65px;
            text-align: center;
            cursor: pointer;
            color: white;
            transition: all 0.2s;
            font-size: 10px;
            font-weight: 600;
        }

        .tool-btn.active {
            border-color: #c5a059;
            background: rgba(197, 160, 89, 0.2);
            transform: translateY(-2px);
        }

        .tool-btn .icon {
            font-size: 18px;
            display: block;
            margin-bottom: 3px;
        }

        /* Кнопки зума справа сбоку */
        .zoom-controls {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 20;
        }

        .zoom-btn {
            width: 46px;
            height: 46px;
            background: rgba(20, 20, 28, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 50%;
            color: white;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        .zoom-btn:active {
            transform: scale(0.92);
            background: rgba(197, 160, 89, 0.3);
            border-color: #c5a059;
        }

        .instruction {
            text-align: center;
            background: rgba(0,0,0,0.6);
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 11px;
            margin-bottom: 4px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.05);
        }
    </style>

    <!-- Подключаем Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- Кнопки зума справа сбоку -->
    <div class="zoom-controls interactive">
        <div class="zoom-btn" onclick="zoomIn()">+</div>
        <div class="zoom-btn" onclick="zoomOut()">−</div>
    </div>

    <div class="ui-layer">
        <header class="interactive">
            <div class="brand-logo">mossari <span>town</span></div>
            <div class="user-info" id="username">Гость</div>
        </header>

        <div class="bottom-ui">
            <div class="instruction">Свободное перемещение во все стороны. Заборы и калитки стыкуются идеально!</div>
            
            <!-- Выпадающее подменю для заборов и калиток -->
            <div id="fenceSubMenu" class="sub-menu interactive">
                <div class="tool-btn" id="btn_fence_wood" onclick="selectFence('fence_wood')">
                    <span class="icon">🪵</span>Забор
                </div>
                <div class="tool-btn" id="btn_gate_wood" onclick="selectFence('gate_wood')">
                    <span class="icon">🚪</span>Калитка
                </div>
                <div class="tool-btn" id="btn_fence_stone" onclick="selectFence('fence_stone')">
                    <span class="icon">🏛️</span>Бордюр
                </div>
                <div class="tool-btn" id="btn_gate_stone" onclick="selectFence('gate_stone')">
                    <span class="icon">🏛️🚪</span>Вх.бордюр
                </div>
                <div class="tool-btn" id="btn_fence_hedge" onclick="selectFence('fence_hedge')">
                    <span class="icon">🌿</span>Изгородь
                </div>
                <div class="tool-btn" id="btn_gate_hedge" onclick="selectFence('gate_hedge')">
                    <span class="icon">🌿🚪</span>Вх.изгородь
                </div>
                <div class="tool-btn" id="btn_fence_mossari" onclick="selectFence('fence_mossari')">
                    <span class="icon">✨</span>Mossari
                </div>
                <div class="tool-btn" id="btn_gate_mossari" onclick="selectFence('gate_mossari')">
                    <span class="icon">✨🚪</span>Mossari калитка
                </div>
            </div>

            <!-- Главная панель инструментов -->
            <div class="toolbar interactive">
                <div class="tool-btn active" id="btn_house" onclick="setTool('house')">
                    <span class="icon">🏠</span>Дом
                </div>
                <div class="tool-btn" id="btn_mall" onclick="setTool('mall')">
                    <span class="icon">🏬</span>ТЦ
                </div>
                <div class="tool-btn" id="btn_admin" onclick="setTool('admin')">
                    <span class="icon">🏢</span>Админ
                </div>
                <div class="tool-btn" id="btn_tree" onclick="setTool('tree')">
                    <span class="icon">🌲</span>Дерево
                </div>
                <div class="tool-btn" id="btn_fence_main" onclick="toggleFenceMenu()">
                    <span class="icon">🚧</span>Ограждение
                </div>
                <div class="tool-btn" id="btn_eraser" onclick="setTool('eraser')">
                    <span class="icon">❌</span>Удалить
                </div>
            </div>
        </div>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        try { tg.expand(); } catch(e) {}

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('username').innerText = user.first_name || 'Житель';
        }

        let currentTool = 'house';

        function toggleFenceMenu() {
            const subMenu = document.getElementById('fenceSubMenu');
            subMenu.classList.toggle('active');
        }

        function selectFence(fenceType) {
            setTool(fenceType);
            const icons = {
                'fence_wood': '🪵',
                'gate_wood': '🚪',
                'fence_stone': '🏛️',
                'gate_stone': '🏛️🚪',
                'fence_hedge': '🌿',
                'gate_hedge': '🌿🚪',
                'fence_mossari': '✨',
                'gate_mossari': '✨🚪'
            };
            document.getElementById('btn_fence_main').querySelector('.icon').innerText = icons[fenceType] || '🚧';
            document.getElementById('fenceSubMenu').classList.remove('active');
        }

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            
            if (tool.startsWith('fence_') || tool.startsWith('gate_')) {
                document.getElementById('btn_fence_main').classList.add('active');
                const btn = document.getElementById('btn_' + tool);
                if (btn) btn.classList.add('active');
            } else {
                const btn = document.getElementById('btn_' + tool);
                if (btn) btn.classList.add('active');
                document.getElementById('fenceSubMenu').classList.remove('active');
            }
        }

        // --- 3D МИР (Three.js) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a2420);

        const width = window.innerWidth || 800;
        const height = window.innerHeight || 600;

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        
        let cameraRadius = 35;
        let cameraHeight = 28;
        const targetCenter = new THREE.Vector3(0, 0, 0);

        function updateCameraPosition() {
            camera.position.x = targetCenter.x;
            camera.position.z = targetCenter.z + cameraRadius;
            camera.position.y = cameraHeight;
            camera.lookAt(targetCenter);
        }
        updateCameraPosition();

        function zoomIn() {
            cameraRadius -= 3;
            cameraHeight -= 2.5;
            if (cameraRadius < 10) { cameraRadius = 10; cameraHeight = 8; }
            updateCameraPosition();
        }

        function zoomOut() {
            cameraRadius += 4;
            cameraHeight += 3.5;
            if (cameraRadius > 70) { cameraRadius = 70; cameraHeight = 60; }
            updateCameraPosition();
        }

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfff8ee, 0.9);
        dirLight.position.set(30, 40, 30);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- ГЕНЕРАЦИЯ СВЕТЛОЙ ТЕКСТУРИРОВАННОЙ ТРАВЫ ---
        function createGrassTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#3a6148';
            ctx.fillRect(0, 0, 512, 512);

            for (let i = 0; i < 25000; i++) {
                const x = Math.random() * 512;
                const y = Math.random() * 512;
                const shade = Math.random();
                ctx.fillStyle = shade > 0.5 ? '#487556' : '#2f523b';
                ctx.fillRect(x, y, 2, 2);
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(25, 25);
            return texture;
        }

        // Карта 100х100 со светлой текстурированной травой
        const groundGeo = new THREE.PlaneGeometry(100, 100);
        const groundMat = new THREE.MeshStandardMaterial({ 
            map: createGrassTexture(), 
            roughness: 0.85,
            metalness: 0.05
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const placedObjects = [];

        function isFenceOrGate(type) {
            return type.startsWith('fence_') || type.startsWith('gate_');
        }

        function createModel(type) {
            const group = new THREE.Group();

            if (type === 'house') {
                const baseMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.2 });
                const base = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.1, 1.4), baseMat);
                base.position.y = 0.55;
                base.castShadow = true;
                group.add(base);

                const roofMat = new THREE.MeshStandardMaterial({ color: 0xc84b31, roughness: 0.4 });
                const roof = new THREE.Mesh(new THREE.ConeGeometry(1.1, 0.9, 4), roofMat);
                roof.position.y = 1.55;
                roof.rotation.y = Math.PI / 4;
                roof.castShadow = true;
                group.add(roof);

                const door = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.55, 0.05), new THREE.MeshStandardMaterial({ color: 0x5a3d28 }));
                door.position.set(0, 0.28, 0.71);
                group.add(door);

                const winMat = new THREE.MeshStandardMaterial({ color: 0x33b5e5, roughness: 0.1 });
                const win1 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.05), winMat);
                win1.position.set(-0.38, 0.7, 0.71);
                group.add(win1);

                const win2 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.05), winMat);
                win2.position.set(0.38, 0.7, 0.71);
                group.add(win2);
            } 
            else if (type === 'mall') {
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0x181820, roughness: 0.2 });
                const body = new THREE.Mesh(new THREE.BoxGeometry(4.8, 3.2, 4.0), bodyMat);
                body.position.y = 1.6;
                body.castShadow = true;
                group.add(body);

                const glassMat = new THREE.MeshStandardMaterial({ color: 0x4090b0, roughness: 0.1, transparent: true, opacity: 0.75 });
                const frontGlass = new THREE.Mesh(new THREE.BoxGeometry(4.0, 1.8, 4.05), glassMat);
                frontGlass.position.y = 1.1;
                group.add(frontGlass);

                const doorMat = new THREE.MeshStandardMaterial({ color: 0x22222a, roughness: 0.3 });
                const doorFrame = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.2, 4.1), doorMat);
                doorFrame.position.set(0, 0.6, 0);
                group.add(doorFrame);

                const winMat = new THREE.MeshStandardMaterial({ color: 0x33b5e5, roughness: 0.1 });
                for (let x = -1.5; x <= 1.5; x += 1.0) {
                    const topWin = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 4.1), winMat);
                    topWin.position.set(x, 2.3, 0);
                    group.add(topWin);
                }

                const roofMat = new THREE.MeshStandardMaterial({ color: 0xc5a059, metalness: 0.6, roughness: 0.2 });
                const roof = new THREE.Mesh(new THREE.BoxGeometry(5.2, 0.25, 4.4), roofMat);
                roof.position.y = 3.32;
                roof.castShadow = true;
                group.add(roof);

                const topBox = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.7, 2.0), bodyMat);
                topBox.position.set(0, 3.82, 0);
                group.add(topBox);

                const signMat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0x554000 });
                const sign = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.2, 2.1), signMat);
                sign.position.set(0, 4.3, 0);
                group.add(sign);
            }
            else if (type === 'admin') {
                const wallMat = new THREE.MeshStandardMaterial({ color: 0x2a3530, roughness: 0.4 });
                const body = new THREE.Mesh(new THREE.BoxGeometry(3.6, 2.6, 3.0), wallMat);
                body.position.y = 1.3;
                body.castShadow = true;
                group.add(body);

                const porchMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.2 });
                const porch = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.4, 3.1), porchMat);
                porch.position.set(0, 0.7, 0);
                group.add(porch);

                const doorMat = new THREE.MeshStandardMaterial({ color: 0x6e4727, roughness: 0.5 });
                const door = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.1, 3.15), doorMat);
                door.position.set(0, 0.55, 0);
                group.add(door);

                const winMat = new THREE.MeshStandardMaterial({ color: 0xffe082, roughness: 0.1, emissive: 0x332200 });
                const win1 = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.8, 3.05), winMat);
                win1.position.set(-1.2, 0.9, 0);
                group.add(win1);

                const win2 = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.8, 3.05), winMat);
                win2.position.set(1.2, 0.9, 0);
                group.add(win2);

                for (let x = -1.2; x <= 1.2; x += 1.2) {
                    const topWin = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 3.05), winMat);
                    topWin.position.set(x, 2.0, 0);
                    group.add(topWin);
                }

                const roofMat = new THREE.MeshStandardMaterial({ color: 0x1b2420, roughness: 0.3 });
                const roof = new THREE.Mesh(new THREE.BoxGeometry(3.9, 0.3, 3.3), roofMat);
                roof.position.y = 2.75;
                roof.castShadow = true;
                group.add(roof);

                const spireMat = new THREE.MeshStandardMaterial({ color: 0xc5a059, metalness: 0.7, roughness: 0.2 });
                const spire = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.2, 4), spireMat);
                spire.position.y = 3.55;
                group.add(spire);
            }
            else if (type === 'tree') {
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.15, 0.8), new THREE.MeshStandardMaterial({ color: 0x6e4727 }));
                trunk.position.y = 0.4;
                trunk.castShadow = true;
                group.add(trunk);

                const leavesMat1 = new THREE.MeshStandardMaterial({ color: 0x2e8b57, roughness: 0.7 });
                const leavesMat2 = new THREE.MeshStandardMaterial({ color: 0x3cb371, roughness: 0.7 });

                const leaf1 = new THREE.Mesh(new THREE.DodecahedronGeometry(0.65), leavesMat1);
                leaf1.position.y = 1.0;
                leaf1.castShadow = true;
                group.add(leaf1);

                const leaf2 = new THREE.Mesh(new THREE.DodecahedronGeometry(0.45), leavesMat2);
                leaf2.position.set(0.25, 1.25, 0.1);
                leaf2.castShadow = true;
                group.add(leaf2);

                const leaf3 = new THREE.Mesh(new THREE.DodecahedronGeometry(0.45), leavesMat2);
                leaf3.position.set(-0.2, 1.15, -0.2);
                leaf3.castShadow = true;
                group.add(leaf3);
            }
            // --- ЗАБОРЫ И КАЛИТКИ ---
            else if (isFenceOrGate(type)) {
                const isGate = type.startsWith('gate_');
                const baseType = type.replace('gate_', 'fence_');

                const mat = baseType === 'fence_stone' ? new THREE.MeshStandardMaterial({ color: 0x707070 }) :
                            baseType === 'fence_hedge' ? new THREE.MeshStandardMaterial({ color: 0x2e6b3e }) :
                            baseType === 'fence_mossari' ? new THREE.MeshStandardMaterial({ color: 0x181818 }) :
                            new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.7 });

                if (!isGate) {
                    if (baseType === 'fence_wood') {
                        for (let i = -0.45; i <= 0.45; i += 0.3) {
                            const post = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.65, 0.12), mat);
                            post.position.set(i, 0.325, 0);
                            post.castShadow = true;
                            group.add(post);
                        }
                        const beam1 = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.08, 0.06), mat);
                        beam1.position.set(0, 0.48, 0);
                        group.add(beam1);

                        const beam2 = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.08, 0.06), mat);
                        beam2.position.set(0, 0.18, 0);
                        group.add(beam2);
                    } else if (baseType === 'fence_stone' || baseType === 'fence_hedge') {
                        const geo = baseType === 'fence_stone' ? new THREE.BoxGeometry(1.2, 0.4, 0.3) : new THREE.BoxGeometry(1.2, 0.7, 0.4);
                        const obj = new THREE.Mesh(geo, mat);
                        obj.position.y = baseType === 'fence_stone' ? 0.2 : 0.35;
                        obj.castShadow = true;
                        group.add(obj);
                    } else if (baseType === 'fence_mossari') {
                        const bar = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.5, 0.15), mat);
                        bar.position.y = 0.25;
                        group.add(bar);
                        const top = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.08, 0.2), new THREE.MeshStandardMaterial({ color: 0xc5a059, metalness: 0.7 }));
                        top.position.y = 0.52;
                        group.add(top);
                    }
                } else {
                    const postMat = mat;
                    const post1 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.65, 0.12), postMat);
                    post1.position.set(-0.5, 0.325, 0);
                    group.add(post1);

                    const post2 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.65, 0.12), postMat);
                    post2.position.set(0.5, 0.325, 0);
                    group.add(post2);

                    const gateMat = baseType === 'fence_mossari' ? new THREE.MeshStandardMaterial({ color: 0xc5a059, metalness: 0.5 }) : postMat;
                    const gateDoor = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.45, 0.06), gateMat);
                    gateDoor.position.set(0, 0.3, 0);
                    group.add(gateDoor);
                }
            }

            return group;
        }

        // --- СОХРАНЕНИЕ ---
        const SAVE_KEY = 'mossari_town_save_v7';

        function saveGame() {
            const dataToSave = placedObjects.map(item => ({
                type: item.type,
                x: item.mesh.position.x,
                z: item.mesh.position.z,
                rotY: item.mesh.rotation.y
            }));
            localStorage.setItem(SAVE_KEY, JSON.stringify(dataToSave));
        }

        function loadGame() {
            let savedData = localStorage.getItem(SAVE_KEY) || localStorage.getItem('mossari_town_save_v6') || localStorage.getItem('mossari_town_save_v5');
            if (savedData) {
                try {
                    const parsed = JSON.parse(savedData);
                    parsed.forEach(data => {
                        let t = data.type;
                        if (t === 'fence') t = 'fence_wood';
                        const model = createModel(t);
                        model.position.set(data.x, 0, data.z);
                        if (data.rotY !== undefined) model.rotation.y = data.rotY;
                        scene.add(model);
                        placedObjects.push({ type: t, mesh: model });
                    });
                } catch(e) {}
            }
        }

        // --- УПРАВЛЕНИЕ: СВОБОДНОЕ ПАНОРАМИРОВАНИЕ ВО ВСЕ СТОРОНЫ И СТЫКОВКА ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        let isDragging = false;
        let hasMoved = false;
        let pointerDownPos = { x: 0, y: 0 };
        let previousMousePosition = { x: 0, y: 0 };

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.interactive') || e.target.closest('.zoom-controls')) return;
            isDragging = true;
            hasMoved = false;
            pointerDownPos = { x: e.clientX, y: e.clientY };
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;

            const dx = e.clientX - pointerDownPos.x;
            const dy = e.clientY - pointerDownPos.y;
            if (Math.sqrt(dx * dx + dy * dy) > 4) {
                hasMoved = true;
            }

            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            // Свободное панорамирование во все стороны без ограничений с мягким ходом
            const panSpeed = 0.04;
            targetCenter.x -= deltaX * panSpeed;
            targetCenter.z -= deltaY * panSpeed;

            // Ограничение центра карты в пределах 45 единиц, чтобы не улететь в пустоту
            targetCenter.x = Math.max(-45, Math.min(45, targetCenter.x));
            targetCenter.z = Math.max(-45, Math.min(45, targetCenter.z));

            updateCameraPosition();
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointerup', (e) => {
            if (!isDragging) return;
            isDragging = false;

            if (!hasMoved) {
                if (e.target.closest('.interactive') || e.target.closest('header') || e.target.closest('.zoom-controls')) {
                    return;
                }

                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(ground);

                if (intersects.length > 0) {
                    const intersect = intersects[0];

                    if (currentTool === 'eraser') {
                        if (placedObjects.length > 0) {
                            let closestObj = null;
                            let minDist = 1.2;
                            let closestIndex = -1;

                            placedObjects.forEach((item, idx) => {
                                const dist = item.mesh.position.distanceTo(intersect.point);
                                if (dist < minDist) {
                                    minDist = dist;
                                    closestObj = item;
                                    closestIndex = idx;
                                }
                            });

                            if (closestObj) {
                                scene.remove(closestObj.mesh);
                                placedObjects.splice(closestIndex, 1);
                                saveGame();
                            }
                        }
                    } else {
                        let posX = intersect.point.x;
                        let posZ = intersect.point.z;
                        let snapRotation = 0;

                        // --- УМНАЯ СТЫКОВКА ВСЕХ ОГРАЖДЕНИЙ (ВЕРТИКАЛЬНЫХ И ГОРИЗОНТАЛЬНЫХ) ---
                        if (isFenceOrGate(currentTool)) {
                            const step = 1.2;
                            const gridX = Math.round(posX / step) * step;
                            const gridZ = Math.round(posZ / step) * step;

                            let hasLeft = false, hasRight = false, hasUp = false, hasDown = false;

                            placedObjects.forEach(item => {
                                if (isFenceOrGate(item.type)) {
                                    const px = item.mesh.position.x;
                                    const pz = item.mesh.position.z;
                                    if (Math.abs(px - (gridX - step)) < 0.2 && Math.abs(pz - gridZ) < 0.2) hasLeft = true;
                                    if (Math.abs(px - (gridX + step)) < 0.2 && Math.abs(pz - gridZ) < 0.2) hasRight = true;
                                    if (Math.abs(px - gridX) < 0.2 && Math.abs(pz - (gridZ - step)) < 0.2) hasUp = true;
                                    if (Math.abs(px - gridX) < 0.2 && Math.abs(pz - (gridZ + step)) < 0.2) hasDown = true;
                                }
                            });

                            if ((hasUp || hasDown) && !(hasLeft || hasRight)) {
                                snapRotation = Math.PI / 2;
                            } else if ((hasLeft || hasRight) && !(hasUp || hasDown)) {
                                snapRotation = 0;
                            } else if (hasUp || hasDown) {
                                snapRotation = Math.PI / 2;
                            } else {
                                snapRotation = 0;
                            }

                            posX = gridX;
                            posZ = gridZ;
                        }

                        // Проверка на наложение объектов
                        let tooClose = false;
                        placedObjects.forEach(item => {
                            const minDist = isFenceOrGate(currentTool) ? 0.75 : 
                                          (currentTool === 'mall' || currentTool === 'admin' ? 3.0 : 1.0);
                            if (item.mesh.position.distanceTo(new THREE.Vector3(posX, 0, posZ)) < minDist) {
                                tooClose = true;
                            }
                        });

                        if (!tooClose) {
                            const model = createModel(currentTool);
                            model.position.set(posX, 0, posZ);
                            if (isFenceOrGate(currentTool)) {
                                model.rotation.y = snapRotation;
                            }
                            scene.add(model);
                            placedObjects.push({ type: currentTool, mesh: model });
                            saveGame();
                        }
                    }
                }
            }
        });

        window.addEventListener('wheel', (e) => {
            cameraRadius += e.deltaY * 0.03;
            cameraHeight += e.deltaY * 0.025;
            if (cameraRadius < 10) { cameraRadius = 10; cameraHeight = 8; }
            if (cameraRadius > 65) { cameraRadius = 65; cameraHeight = 55; }
            updateCameraPosition();
        }, { passive: true });

        loadGame();

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
    </script>
</body>
</html>
