<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mossari Town</title>
    <!-- Подключаем официальный скрипт Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #1a1a24);
            color: var(--tg-theme-text-color, #ffffff);
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 20px;
        }

        .interactive {
            pointer-events: auto;
        }

        header {
            background: rgba(20, 20, 28, 0.85);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .brand-logo {
            font-weight: 800;
            letter-spacing: 2px;
            font-size: 16px;
            text-transform: uppercase;
        }

        .brand-logo span {
            color: #c5a059;
        }

        .user-info {
            font-size: 13px;
            font-weight: 600;
            color: #c5a059;
            background: rgba(197, 160, 89, 0.15);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(197, 160, 89, 0.3);
        }

        .toolbar {
            background: rgba(20, 20, 28, 0.85);
            backdrop-filter: blur(12px);
            padding: 12px;
            border-radius: 20px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            border: 1px solid rgba(255,255,255,0.08);
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        .tool-btn {
            background: rgba(255,255,255,0.04);
            border: 2px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 10px;
            flex: 1;
            min-width: 75px;
            text-align: center;
            cursor: pointer;
            color: white;
            transition: all 0.2s;
            font-size: 11px;
            font-weight: 600;
        }

        .tool-btn.active {
            border-color: #c5a059;
            background: rgba(197, 160, 89, 0.2);
            transform: translateY(-2px);
        }

        .tool-btn .icon {
            font-size: 20px;
            display: block;
            margin-bottom: 4px;
        }

        .instruction {
            text-align: center;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 12px;
            margin-bottom: 12px;
            align-self: center;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.05);
        }
    </style>

    <!-- Подключаем Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <header class="interactive">
            <div class="brand-logo">mossari <span>town</span></div>
            <div class="user-info" id="username">Гость</div>
        </header>

        <div style="display: flex; flex-direction: column; width: 100%;">
            <div class="instruction">Кликайте по лужайке для постройки объектов Mossari!</div>
            
            <div class="toolbar interactive">
                <div class="tool-btn active" onclick="setTool('house', event)">
                    <span class="icon">🏠</span>Дом
                </div>
                <div class="tool-btn" onclick="setTool('tree', event)">
                    <span class="icon">🌲</span>Дерево
                </div>
                <div class="tool-btn" onclick="setTool('modern_bench', event)">
                    <span class="icon">🛋️</span>Лаунж
                </div>
                <div class="tool-btn" onclick="setTool('store', event)">
                    <span class="icon">✨</span>Бутик
                </div>
                <div class="tool-btn" onclick="setTool('eraser', event)">
                    <span class="icon">❌</span>Удалить
                </div>
            </div>
        </div>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const user = tg.initDataUnsafe.user;
                document.getElementById('username').innerText = user.first_name || 'Житель';
            }
        }

        let currentTool = 'house';

        // Инициализация Three.js 3D мира
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x12121a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 16);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Поддержка Retina на Mac
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfff5e6, 0.9);
        dirLight.position.set(15, 25, 15);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Лужайка
        const groundGeo = new THREE.PlaneGeometry(30, 30);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x24342b, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const placedObjects = [];

        function createModel(type) {
            const group = new THREE.Group();

            if (type === 'house') {
                const baseMat = new THREE.MeshStandardMaterial({ color: 0xefefef, roughness: 0.3 });
                const baseGeo = new THREE.BoxGeometry(1.4, 1.2, 1.4);
                const base = new THREE.Mesh(baseGeo, baseMat);
                base.position.y = 0.6;
                group.add(base);

                const roofMat = new THREE.MeshStandardMaterial({ color: 0x2c2c2c });
                const roofGeo = new THREE.ConeGeometry(1.1, 0.9, 4);
                const roof = new THREE.Mesh(roofGeo, roofMat);
                roof.position.y = 1.65;
                roof.rotation.y = Math.PI / 4;
                group.add(roof);
            } 
            else if (type === 'tree') {
                const trunkMat = new THREE.MeshStandardMaterial({ color: 0x7a5230 });
                const trunkGeo = new THREE.CylinderGeometry(0.12, 0.18, 0.7);
                const trunk = new THREE.Mesh(trunkGeo, trunkMat);
                trunk.position.y = 0.35;
                group.add(trunk);

                const leavesMat = new THREE.MeshStandardMaterial({ color: 0x3d6b4f });
                const leavesGeo = new THREE.DodecahedronGeometry(0.7);
                const leaves = new THREE.Mesh(leavesGeo, leavesMat);
                leaves.position.y = 1.1;
                group.add(leaves);
            } 
            else if (type === 'modern_bench') {
                const benchMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
                const seatGeo = new THREE.BoxGeometry(1.2, 0.15, 0.5);
                const seat = new THREE.Mesh(seatGeo, benchMat);
                seat.position.y = 0.3;
                group.add(seat);
            } 
            else if (type === 'store') {
                const baseMat = new THREE.MeshStandardMaterial({ color: 0x181818, roughness: 0.2 });
                const baseGeo = new THREE.BoxGeometry(1.8, 1.4, 1.8);
                const base = new THREE.Mesh(baseGeo, baseMat);
                base.position.y = 0.7;
                group.add(base);

                const roofMat = new THREE.MeshStandardMaterial({ color: 0xc5a059, metalness: 0.6 });
                const roofGeo = new THREE.BoxGeometry(1.9, 0.25, 1.9);
                const roof = new THREE.Mesh(roofGeo, roofMat);
                roof.position.y = 1.52;
                group.add(roof);
            }

            return group;
        }

        function setTool(tool, ev) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            if (ev && ev.currentTarget) {
                ev.currentTarget.classList.add('active');
            }
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // Обработка кликов с точным расчетом границ экрана для Mac и ПК
        window.addEventListener('pointerdown', (event) => {
            if (event.target.closest('.interactive') || event.target.closest('header') || event.target.closest('.toolbar')) {
                return;
            }

            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(ground);

            if (intersects.length > 0) {
                const intersect = intersects[0];

                if (currentTool === 'eraser') {
                    if (placedObjects.length > 0) {
                        let closestObj = null;
                        let minDist = 1.5;
                        let closestIndex = -1;

                        placedObjects.forEach((obj, idx) => {
                            const dist = obj.position.distanceTo(intersect.point);
                            if (dist < minDist) {
                                minDist = dist;
                                closestObj = obj;
                                closestIndex = idx;
                            }
                        });

                        if (closestObj) {
                            scene.remove(closestObj);
                            placedObjects.splice(closestIndex, 1);
                        }
                    }
                } else {
                    const model = createModel(currentTool);
                    model.position.set(intersect.point.x, 0, intersect.point.z);
                    scene.add(model);
                    placedObjects.push(model);
                }
            }
        });

        // Вращение камеры мышкой / тачпадом на Mac
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraAngle = 0;

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.interactive')) return;
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousMousePosition.x;
            cameraAngle -= deltaX * 0.007;

            camera.position.x = Math.sin(cameraAngle) * 18;
            camera.position.z = Math.cos(cameraAngle) * 18;
            camera.lookAt(0, 0, 0);

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointerup', () => { isDragging = false; });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
