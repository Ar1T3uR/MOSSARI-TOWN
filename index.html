<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mossari Town</title>
    <!-- Подключаем официальный скрипт Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1a1a24;
            color: #ffffff;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            overscroll-behavior: none;
            touch-action: none;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            z-index: 1;
            touch-action: none;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 16px;
            z-index: 10;
        }

        .interactive {
            pointer-events: auto;
        }

        /* Заголовок по центру на уровне кнопки «Закрыть» */
        .top-brand {
            position: absolute;
            top: 56px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 28, 0.75);
            backdrop-filter: blur(10px);
            padding: 6px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
            font-weight: 800;
            letter-spacing: 2px;
            font-size: 13px;
            text-transform: uppercase;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 20;
        }

        .top-brand span {
            color: #c5a059;
        }

        .bottom-ui {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        /* Переключатель режимов внизу */
        .mode-switcher {
            display: flex;
            background: rgba(20, 20, 28, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 4px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 12px;
            font-weight: 700;
            padding: 8px 18px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: #c5a059;
            color: #1a1a24;
            box-shadow: 0 2px 10px rgba(197, 160, 89, 0.4);
        }

        /* Панель с предметами */
        .build-panel-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }

        .build-panel-container.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .toolbar {
            background: rgba(20, 20, 28, 0.9);
            backdrop-filter: blur(12px);
            padding: 10px 12px;
            border-radius: 20px;
            display: flex;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.08);
            max-width: 100%;
            margin: 0 auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x;
        }

        .toolbar::-webkit-scrollbar {
            display: none;
        }

        .tool-btn {
            background: rgba(255,255,255,0.04);
            border: 2px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 8px 10px;
            flex: 0 0 auto;
            min-width: 65px;
            text-align: center;
            cursor: pointer;
            color: white;
            transition: all 0.2s;
            font-size: 10px;
            font-weight: 600;
        }

        .tool-btn.active {
            border-color: #c5a059;
            background: rgba(197, 160, 89, 0.2);
            transform: translateY(-2px);
        }

        .tool-btn .icon {
            font-size: 18px;
            display: block;
            margin-bottom: 3px;
        }

        .instruction {
            text-align: center;
            background: rgba(0,0,0,0.6);
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 11px;
            margin-bottom: 4px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.05);
        }
    </style>

    <!-- Подключаем Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- Заголовок по центру на уровне кнопки «Закрыть» -->
    <div class="top-brand interactive">mossari <span>town</span></div>

    <div class="ui-layer">
        <div></div>

        <div class="bottom-ui">
            <div class="instruction" id="instructionText">Город разделен на районы с дорогами. Дороги неизменяемы.</div>
            
            <!-- Панель предметов -->
            <div id="buildPanel" class="build-panel-container interactive">
                <!-- Главная панель инструментов (без ограждений) -->
                <div class="toolbar interactive">
                    <div class="tool-btn active" id="btn_house" onclick="setTool('house')">
                        <span class="icon">🏠</span>Дом
                    </div>
                    <div class="tool-btn" id="btn_mall" onclick="setTool('mall')">
                        <span class="icon">🏬</span>ТЦ
                    </div>
                    <div class="tool-btn" id="btn_admin" onclick="setTool('admin')">
                        <span class="icon">🏢</span>Админ
                    </div>
                    <div class="tool-btn" id="btn_tree" onclick="setTool('tree')">
                        <span class="icon">🌲</span>Дерево
                    </div>
                    <div class="tool-btn" id="btn_eraser" onclick="setTool('eraser')">
                        <span class="icon">❌</span>Удалить
                    </div>
                </div>
            </div>

            <!-- Переключатель режимов внизу -->
            <div class="mode-switcher interactive">
                <button id="btnModeView" class="mode-btn active" onclick="setInteractionMode('view')">👁️ Обзор</button>
                <button id="btnModeBuild" class="mode-btn" onclick="setInteractionMode('build')">🔨 Стройка</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        try { 
            tg.expand(); 
            if (typeof tg.disableVerticalSwipes === 'function') {
                tg.disableVerticalSwipes();
            }
        } catch(e) {}

        let currentTool = 'house';
        let interactionMode = 'view';

        function setInteractionMode(mode) {
            interactionMode = mode;
            document.getElementById('btnModeView').classList.toggle('active', mode === 'view');
            document.getElementById('btnModeBuild').classList.toggle('active', mode === 'build');

            const buildPanel = document.getElementById('buildPanel');
            const instr = document.getElementById('instructionText');

            if (mode === 'view') {
                buildPanel.classList.remove('active');
                instr.innerText = 'Режим обзора: карта свободно перемещается и зумируется.';
                if (typeof gridHelper !== 'undefined') gridHelper.visible = false;
            } else {
                buildPanel.classList.add('active');
                instr.innerText = 'Режим постройки: здания размещаются на участках.';
                if (typeof gridHelper !== 'undefined') gridHelper.visible = true;
            }
        }

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById('btn_' + tool);
            if (btn) btn.classList.add('active');
            setInteractionMode('build');
        }

        // --- 3D МИР (Three.js) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a2420);

        const width = window.innerWidth || 800;
        const height = window.innerHeight || 600;

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        
        let cameraRadius = 35;
        let cameraHeight = 28;
        const targetCenter = new THREE.Vector3(0, 0, 0);

        function updateCameraPosition() {
            camera.position.x = targetCenter.x;
            camera.position.z = targetCenter.z + cameraRadius;
            camera.position.y = cameraHeight;
            camera.lookAt(targetCenter);
        }
        updateCameraPosition();

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfff8ee, 0.9);
        dirLight.position.set(30, 40, 30);
        dirLight.castShadow = true;
        scene.add(dirLight);

        function createGrassTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#3a6148';
            ctx.fillRect(0, 0, 512, 512);

            for (let i = 0; i < 25000; i++) {
                const x = Math.random() * 512;
                const y = Math.random() * 512;
                const shade = Math.random();
                ctx.fillStyle = shade > 0.5 ? '#487556' : '#2f523b';
                ctx.fillRect(x, y, 2, 2);
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(25, 25);
            return texture;
        }

        const groundGeo = new THREE.PlaneGeometry(100, 100);
        const groundMat = new THREE.MeshStandardMaterial({ 
            map: createGrassTexture(), 
            roughness: 0.85,
            metalness: 0.05
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const gridHelper = new THREE.GridHelper(96, 80, 0xc5a059, 0x457555);
        gridHelper.position.y = 0.02;
        gridHelper.visible = false;
        scene.add(gridHelper);

        const placedObjects = [];
        const CELL_SIZE = 1.2;

        function getObjectSizeInCells(type) {
            if (type === 'mall') return { w: 4, h: 4 };
            if (type === 'admin') return { w: 3, h: 3 };
            return { w: 1, h: 1 };
        }

        function createModel(type) {
            const group = new THREE.Group();
            const innerGroup = new THREE.Group();

            let offsetX = CELL_SIZE / 2;
            let offsetZ = CELL_SIZE / 2;

            if (type === 'road') {
                const roadMat = new THREE.MeshStandardMaterial({ color: 0x44444d, roughness: 0.9 });
                const roadTile = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.03, 1.2), roadMat);
                roadTile.position.y = 0.015;
                roadTile.receiveShadow = true;
                innerGroup.add(roadTile);

                const stripeMat = new THREE.MeshStandardMaterial({ color: 0xcccccc });
                const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.035, 0.6), stripeMat);
                stripe.position.y = 0.02;
                innerGroup.add(stripe);
            }
            else if (type === 'house') {
                const baseMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.2 });
                const base = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.1, 1.2), baseMat);
                base.position.y = 0.55;
                base.castShadow = true;
                innerGroup.add(base);

                const roofMat = new THREE.MeshStandardMaterial({ color: 0xc84b31, roughness: 0.4 });
                const roof = new THREE.Mesh(new THREE.ConeGeometry(0.95, 0.9, 4), roofMat);
                roof.position.y = 1.55;
                roof.rotation.y = Math.PI / 4;
                roof.castShadow = true;
                innerGroup.add(roof);

                const door = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.55, 0.05), new THREE.MeshStandardMaterial({ color: 0x5a3d28 }));
                door.position.set(0, 0.28, 0.61);
                innerGroup.add(door);

                const winMat = new THREE.MeshStandardMaterial({ color: 0x33b5e5, roughness: 0.1 });
                const win1 = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.25, 0.05), winMat);
                win1.position.set(-0.3, 0.7, 0.61);
                innerGroup.add(win1);

                const win2 = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.25, 0.05), winMat);
                win2.position.set(0.3, 0.7, 0.61);
                innerGroup.add(win2);
            } 
            else if (type === 'mall') {
                offsetX = (4 * CELL_SIZE) / 2;
                offsetZ = (4 * CELL_SIZE) / 2;
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0x181820, roughness: 0.2 });
                const body = new THREE.Mesh(new THREE.BoxGeometry(4.6, 3.2, 4.6), bodyMat);
                body.position.y = 1.6;
                body.castShadow = true;
                innerGroup.add(body);

                const glassMat = new THREE.MeshStandardMaterial({ color: 0x4090b0, roughness: 0.1, transparent: true, opacity: 0.75 });
                const frontGlass = new THREE.Mesh(new THREE.BoxGeometry(3.8, 1.8, 4.65), glassMat);
                frontGlass.position.y = 1.1;
                innerGroup.add(frontGlass);

                const doorMat = new THREE.MeshStandardMaterial({ color: 0x22222a, roughness: 0.3 });
                const doorFrame = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.2, 4.7), doorMat);
                doorFrame.position.set(0, 0.6, 0);
                innerGroup.add(doorFrame);

                const winMat = new THREE.MeshStandardMaterial({ color: 0x33b5e5, roughness: 0.1 });
                for (let x = -1.5; x <= 1.5; x += 1.0) {
                    const topWin = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 4.7), winMat);
                    topWin.position.set(x, 2.3, 0);
                    innerGroup.add(topWin);
                }

                const roofMat = new THREE.MeshStandardMaterial({ color: 0xc5a059, metalness: 0.6, roughness: 0.2 });
                const roof = new THREE.Mesh(new THREE.BoxGeometry(4.8, 0.25, 4.8), roofMat);
                roof.position.y = 3.32;
                roof.castShadow = true;
                innerGroup.add(roof);

                const topBox = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.7, 2.4), bodyMat);
                topBox.position.set(0, 3.82, 0);
                innerGroup.add(topBox);

                const signMat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0x554000 });
                const sign = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.2, 2.5), signMat);
                sign.position.set(0, 4.3, 0);
                innerGroup.add(sign);
            }
            else if (type === 'admin') {
                offsetX = (3 * CELL_SIZE) / 2;
                offsetZ = (3 * CELL_SIZE) / 2;
                const wallMat = new THREE.MeshStandardMaterial({ color: 0x2a3530, roughness: 0.4 });
                const body = new THREE.Mesh(new THREE.BoxGeometry(3.4, 2.6, 3.4), wallMat);
                body.position.y = 1.3;
                body.castShadow = true;
                innerGroup.add(body);

                const porchMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.2 });
                const porch = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.4, 3.5), porchMat);
                porch.position.set(0, 0.7, 0);
                innerGroup.add(porch);

                const doorMat = new THREE.MeshStandardMaterial({ color: 0x6e4727, roughness: 0.5 });
                const door = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.1, 3.55), doorMat);
                door.position.set(0, 0.55, 0);
                innerGroup.add(door);

                const winMat = new THREE.MeshStandardMaterial({ color: 0xffe082, roughness: 0.1, emissive: 0x332200 });
                const win1 = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.8, 3.45), winMat);
                win1.position.set(-1.0, 0.9, 0);
                innerGroup.add(win1);

                const win2 = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.8, 3.45), winMat);
                win2.position.set(1.0, 0.9, 0);
                innerGroup.add(win2);

                for (let x = -1.0; x <= 1.0; x += 1.0) {
                    const topWin = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 3.45), winMat);
                    topWin.position.set(x, 2.0, 0);
                    innerGroup.add(topWin);
                }

                const roofMat = new THREE.MeshStandardMaterial({ color: 0x1b2420, roughness: 0.3 });
                const roof = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.3, 3.6), roofMat);
                roof.position.y = 2.75;
                roof.castShadow = true;
                innerGroup.add(roof);

                const spireMat = new THREE.MeshStandardMaterial({ color: 0xc5a059, metalness: 0.7, roughness: 0.2 });
                const spire = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.2, 4), spireMat);
                spire.position.y = 3.55;
                innerGroup.add(spire);
            }
            else if (type === 'tree') {
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.15, 0.8), new THREE.MeshStandardMaterial({ color: 0x6e4727 }));
                trunk.position.y = 0.4;
                trunk.castShadow = true;
                innerGroup.add(trunk);

                const leavesMat1 = new THREE.MeshStandardMaterial({ color: 0x2e8b57, roughness: 0.7 });
                const leavesMat2 = new THREE.MeshStandardMaterial({ color: 0x3cb371, roughness: 0.7 });

                const leaf1 = new THREE.Mesh(new THREE.DodecahedronGeometry(0.65), leavesMat1);
                leaf1.position.y = 1.0;
                leaf1.castShadow = true;
                innerGroup.add(leaf1);

                const leaf2 = new THREE.Mesh(new THREE.DodecahedronGeometry(0.45), leavesMat2);
                leaf2.position.set(0.25, 1.25, 0.1);
                leaf2.castShadow = true;
                innerGroup.add(leaf2);

                const leaf3 = new THREE.Mesh(new THREE.DodecahedronGeometry(0.45), leavesMat2);
                leaf3.position.set(-0.2, 1.15, -0.2);
                leaf3.castShadow = true;
                innerGroup.add(leaf3);
            }

            innerGroup.position.set(-offsetX, 0, -offsetZ);
            group.add(innerGroup);
            return group;
        }

        const SAVE_KEY = 'mossari_town_save_v13';

        function saveGame() {
            const dataToSave = placedObjects.map(item => ({
                type: item.type,
                x: item.mesh.position.x,
                z: item.mesh.position.z,
                rotY: item.mesh.rotation.y
            }));
            localStorage.setItem(SAVE_KEY, JSON.stringify(dataToSave));
        }

        // Генерация четких районов с дорогами и участками
        function generateDistrictLayout() {
            const items = [];
            const districtSize = 7.2; // размер одного района в ячейках (6 ячеек по 1.2)
            const minC = -21.6;
            const maxC = 21.6;

            // 1. Создаем неизменяемые дороги по периметрам и границам районов
            for (let x = minC; x <= maxC; x += CELL_SIZE) {
                for (let z = minC; z <= maxC; z += CELL_SIZE) {
                    // Проверяем, является ли координата границей района (дорога)
                    const isRoadX = Math.abs(x % districtSize) < 0.01;
                    const isRoadZ = Math.abs(z % districtSize) < 0.01;

                    if (isRoadX || isRoadZ || x === minC || x === maxC || z === minC || z === maxC) {
                        const model = createModel('road');
                        model.position.set(x, 0, z);
                        scene.add(model);
                        items.push({ type: 'road', mesh: model, isRoad: true });
                    }
                }
            }

            // 2. Расставляем стартовые здания внутри участков районов
            const starterBuildings = [
                { type: 'house', x: -14.4, z: -14.4 },
                { type: 'mall', x: -7.2, z: -14.4 },
                { type: 'admin', x: 2.4, z: -14.4 },
                { type: 'tree', x: -14.4, z: -7.2 },
                { type: 'house', x: 2.4, z: -7.2 },
                { type: 'house', x: -14.4, z: 2.4 },
                { type: 'mall', x: -7.2, z: 2.4 },
                { type: 'tree', x: 2.4, z: 2.4 }
            ];

            starterBuildings.forEach(b => {
                const model = createModel(b.type);
                model.position.set(b.x, 0, b.z);
                scene.add(model);
                items.push({ type: b.type, mesh: model, isRoad: false });
            });

            return items;
        }

        function loadGame() {
            let savedData = localStorage.getItem(SAVE_KEY);
            if (savedData) {
                try {
                    const parsed = JSON.parse(savedData);
                    parsed.forEach(data => {
                        const model = createModel(data.type);
                        model.position.set(data.x, 0, data.z);
                        if (data.rotY !== undefined) model.rotation.y = data.rotY;
                        scene.add(model);
                        placedObjects.push({ 
                            type: data.type, 
                            mesh: model, 
                            isRoad: (data.type === 'road') 
                        });
                    });
                    return;
                } catch(e) {}
            }

            // Если сохранения нет, генерируем карту районов с дорогами
            const defaultLayout = generateDistrictLayout();
            defaultLayout.forEach(item => placedObjects.push(item));
            saveGame();
        }

        function checkCollision(posX, posZ, type, excludeObj = null) {
            const size = getObjectSizeInCells(type);
            const myMinX = posX;
            const myMaxX = posX + size.w * CELL_SIZE;
            const myMinZ = posZ;
            const myMaxZ = posZ + size.h * CELL_SIZE;

            for (let item of placedObjects) {
                if (item === excludeObj) continue;
                const otherSize = getObjectSizeInCells(item.type);
                const otherMinX = item.mesh.position.x;
                const otherMaxX = item.mesh.position.x + otherSize.w * CELL_SIZE;
                const otherMinZ = item.mesh.position.z;
                const otherMaxZ = item.mesh.position.z + otherSize.h * CELL_SIZE;

                if (myMinX < otherMaxX && myMaxX > otherMinX && myMinZ < otherMaxZ && myMaxZ > otherMinZ) {
                    return true;
                }
            }
            return false;
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        let isDragging = false;
        let hasMoved = false;
        let pointerDownPos = { x: 0, y: 0 };
        let previousMousePosition = { x: 0, y: 0 };
        
        let initialPinchDistance = null;
        let startCameraRadius = cameraRadius;
        let startCameraHeight = cameraHeight;

        let draggedObject = null;

        function handleInteractionStart(clientX, clientY) {
            if (interactionMode !== 'build') return;

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            if (currentTool === 'eraser') {
                const intersects = raycaster.intersectObject(ground);
                if (intersects.length > 0 && placedObjects.length > 0) {
                    let closestObj = null;
                    let minDist = 1.5;
                    let closestIndex = -1;

                    placedObjects.forEach((item, idx) => {
                        if (item.isRoad) return; // Дороги нельзя удалять!
                        const dist = item.mesh.position.distanceTo(intersects[0].point);
                        if (dist < minDist) {
                            minDist = dist;
                            closestObj = item;
                            closestIndex = idx;
                        }
                    });

                    if (closestObj) {
                        scene.remove(closestObj.mesh);
                        placedObjects.splice(closestIndex, 1);
                        saveGame();
                    }
                }
                return;
            }

            const objectMeshes = placedObjects.map(item => item.mesh);
            const intersectsObjects = raycaster.intersectObjects(objectMeshes, true);

            if (intersectsObjects.length > 0) {
                let hitMesh = intersectsObjects[0].object;
                while (hitMesh.parent && hitMesh.parent !== scene) {
                    if (placedObjects.some(item => item.mesh === hitMesh.parent)) {
                        hitMesh = hitMesh.parent;
                        break;
                    }
                    hitMesh = hitMesh.parent;
                }

                const foundIndex = placedObjects.findIndex(item => item.mesh === hitMesh);
                if (foundIndex !== -1) {
                    if (placedObjects[foundIndex].isRoad) return; // Дороги нельзя двигать
                    draggedObject = placedObjects[foundIndex];
                    placedObjects.splice(foundIndex, 1);
                    return;
                }
            }

            const intersectsGround = raycaster.intersectObject(ground);
            if (intersectsGround.length > 0) {
                const intersect = intersectsGround[0];
                let posX = Math.round(intersect.point.x / CELL_SIZE) * CELL_SIZE;
                let posZ = Math.round(intersect.point.z / CELL_SIZE) * CELL_SIZE;

                if (!checkCollision(posX, posZ, currentTool)) {
                    const model = createModel(currentTool);
                    model.position.set(posX, 0, posZ);
                    scene.add(model);
                    placedObjects.push({ type: currentTool, mesh: model, isRoad: false });
                    saveGame();
                    
                    draggedObject = placedObjects[placedObjects.length - 1];
                    placedObjects.pop();
                }
            }
        }

        function handleInteractionMove(clientX, clientY) {
            if (!draggedObject) return;

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(ground);

            if (intersects.length > 0) {
                let posX = Math.round(intersects[0].point.x / CELL_SIZE) * CELL_SIZE;
                let posZ = Math.round(intersects[0].point.z / CELL_SIZE) * CELL_SIZE;

                draggedObject.mesh.position.set(posX, 0, posZ);
            }
        }

        function handleInteractionEnd() {
            if (!draggedObject) return;

            let posX = draggedObject.mesh.position.x;
            let posZ = draggedObject.mesh.position.z;

            if (checkCollision(posX, posZ, draggedObject.type, draggedObject)) {
                scene.remove(draggedObject.mesh);
            } else {
                placedObjects.push(draggedObject);
                saveGame();
            }
            draggedObject = null;
        }

        // Обработка касаний (Touch)
        window.addEventListener('touchstart', (e) => {
            if (e.target.closest('.interactive')) return;
            if (e.touches.length === 2) {
                isDragging = false;
                initialPinchDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                startCameraRadius = cameraRadius;
                startCameraHeight = cameraHeight;
            } else if (e.touches.length === 1) {
                if (interactionMode === 'build') {
                    handleInteractionStart(e.touches[0].clientX, e.touches[0].clientY);
                    if (draggedObject) return;
                }
                isDragging = true;
                hasMoved = false;
                pointerDownPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialPinchDistance !== null) {
                e.preventDefault();
                const currentDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const scale = initialPinchDistance / currentDist;
                
                cameraRadius = Math.max(10, Math.min(65, startCameraRadius * scale));
                cameraHeight = Math.max(8, Math.min(55, startCameraHeight * scale));
                updateCameraPosition();
            } else if (e.touches.length === 1) {
                const touch = e.touches[0];
                if (draggedObject) {
                    e.preventDefault();
                    handleInteractionMove(touch.clientX, touch.clientY);
                    return;
                }
                if (isDragging) {
                    const dx = touch.clientX - pointerDownPos.x;
                    const dy = touch.clientY - pointerDownPos.y;
                    if (Math.sqrt(dx * dx + dy * dy) > 5) {
                        hasMoved = true;
                    }

                    const deltaX = touch.clientX - previousMousePosition.x;
                    const deltaY = touch.clientY - previousMousePosition.y;

                    const panSpeed = 0.04;
                    targetCenter.x -= deltaX * panSpeed;
                    targetCenter.z -= deltaY * panSpeed;

                    targetCenter.x = Math.max(-45, Math.min(45, targetCenter.x));
                    targetCenter.z = Math.max(-45, Math.min(45, targetCenter.z));

                    updateCameraPosition();
                    previousMousePosition = { x: touch.clientX, y: touch.clientY };
                }
            }
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                initialPinchDistance = null;
            }
            if (draggedObject) {
                handleInteractionEnd();
            }
            if (e.touches.length === 0) {
                isDragging = false;
            }
        });

        // Обработка мыши (Desktop)
        window.addEventListener('pointerdown', (e) => {
            if (e.pointerType === 'touch') return;
            if (e.target.closest('.interactive')) return;

            if (interactionMode === 'build') {
                handleInteractionStart(e.clientX, e.clientY);
                if (draggedObject) return;
            }

            isDragging = true;
            hasMoved = false;
            pointerDownPos = { x: e.clientX, y: e.clientY };
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointermove', (e) => {
            if (e.pointerType === 'touch') return;
            if (draggedObject) {
                handleInteractionMove(e.clientX, e.clientY);
                return;
            }
            if (!isDragging) return;

            const dx = e.clientX - pointerDownPos.x;
            const dy = e.clientY - pointerDownPos.y;
            if (Math.sqrt(dx * dx + dy * dy) > 5) {
                hasMoved = true;
            }

            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            const panSpeed = 0.04;
            targetCenter.x -= deltaX * panSpeed;
            targetCenter.z -= deltaY * panSpeed;

            targetCenter.x = Math.max(-45, Math.min(45, targetCenter.x));
            targetCenter.z = Math.max(-45, Math.min(45, targetCenter.z));

            updateCameraPosition();
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointerup', (e) => {
            if (e.pointerType === 'touch') return;
            if (draggedObject) {
                handleInteractionEnd();
                return;
            }
            if (!isDragging) return;
            isDragging = false;
        });

        window.addEventListener('wheel', (e) => {
            cameraRadius += e.deltaY * 0.03;
            cameraHeight += e.deltaY * 0.025;
            if (cameraRadius < 10) { cameraRadius = 10; cameraHeight = 8; }
            if (cameraRadius > 65) { cameraRadius = 65; cameraHeight = 55; }
            updateCameraPosition();
        }, { passive: true });

        loadGame();

        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
