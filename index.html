<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mossari Town - Tycoon</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1a1a24; color: #fff; user-select: none;
            -webkit-user-select: none; overscroll-behavior: none; touch-action: none;
        }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; touch-action: none; }
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; box-sizing: border-box; z-index: 10; }
        .interactive { pointer-events: auto; }
        
        .top-brand {
            position: absolute; top: 56px; left: 50%; transform: translateX(-50%);
            background: rgba(20, 20, 28, 0.85); backdrop-filter: blur(10px); padding: 8px 20px;
            border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); font-weight: 800;
            letter-spacing: 2px; font-size: 13px; text-transform: uppercase; box-shadow: 0 4px 20px rgba(0,0,0,0.4); z-index: 20;
            display: flex; gap: 15px; align-items: center;
        }
        .top-brand span { color: #c5a059; }
        .money-counter { color: #4cd137; font-size: 14px; font-weight: 700; }

        .bottom-ui { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
        .mode-switcher {
            display: flex; background: rgba(20, 20, 28, 0.9); backdrop-filter: blur(12px);
            border-radius: 16px; padding: 4px; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }
        .mode-btn { background: transparent; border: none; color: #aaa; font-size: 12px; font-weight: 700; padding: 8px 18px; border-radius: 12px; cursor: pointer; transition: all 0.2s; }
        .mode-btn.active { background: #c5a059; color: #1a1a24; box-shadow: 0 2px 10px rgba(197, 160, 89, 0.4); }
        
        .build-panel-container { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; transition: all 0.3s ease; opacity: 0; transform: translateY(20px); pointer-events: none; }
        .build-panel-container.active { opacity: 1; transform: translateY(0); pointer-events: auto; }
        
        .toolbar {
            background: rgba(20, 20, 28, 0.9); backdrop-filter: blur(12px); padding: 10px 12px;
            border-radius: 20px; display: flex; gap: 8px; border: 1px solid rgba(255,255,255,0.08);
            max-width: 100%; margin: 0 auto; box-shadow: 0 10px 40px rgba(0,0,0,0.4); overflow-x: auto; touch-action: pan-x;
        }
        .toolbar::-webkit-scrollbar { display: none; }
        .tool-btn {
            background: rgba(255,255,255,0.04); border: 2px solid rgba(255,255,255,0.08); border-radius: 14px;
            padding: 8px 10px; flex: 0 0 auto; min-width: 65px; text-align: center; cursor: pointer; color: white; font-size: 10px; font-weight: 600;
        }
        .tool-btn.active { border-color: #c5a059; background: rgba(197, 160, 89, 0.2); transform: translateY(-2px); }
        .tool-btn .icon { font-size: 18px; display: block; margin-bottom: 3px; }
        .instruction { text-align: center; background: rgba(0,0,0,0.6); padding: 6px 14px; border-radius: 12px; font-size: 11px; margin-bottom: 4px; backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.05); }

        #propertyModal {
            position: fixed; bottom: -100%; left: 0; width: 100%; background: rgba(25, 25, 35, 0.95);
            backdrop-filter: blur(20px); border-top-left-radius: 24px; border-top-right-radius: 24px;
            border-top: 1px solid rgba(255,255,255,0.1); padding: 24px; box-sizing: border-box;
            transition: bottom 0.3s ease; z-index: 100; box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
        }
        #propertyModal.active { bottom: 0; }
        .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 12px; color: #c5a059; display: flex; justify-content: space-between; }
        .modal-info { font-size: 13px; color: #bbb; margin-bottom: 16px; line-height: 1.5; }
        .modal-info b { color: #fff; }
        .price-input-group { display: flex; gap: 10px; margin-bottom: 16px; }
        .price-input {
            flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 12px; color: #fff; font-size: 14px; font-weight: 700; outline: none;
        }
        .modal-btn {
            background: #c5a059; color: #1a1a24; border: none; border-radius: 12px;
            padding: 12px 20px; font-weight: 800; font-size: 13px; cursor: pointer;
        }
        .modal-close { background: transparent; border: none; color: #888; font-size: 16px; cursor: pointer; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div class="top-brand interactive">
        <span>mossari town</span>
        <div class="money-counter">💰 <span id="balanceText">1,500</span> МР</div>
    </div>

    <div class="ui-layer">
        <div></div>
        <div class="bottom-ui">
            <div class="instruction" id="instructionText">Нажмите на здание в режиме «Обзор», чтобы открыть рынок и настроить цену.</div>
            
            <div id="buildPanel" class="build-panel-container interactive">
                <div class="toolbar interactive">
                    <div class="tool-btn active" id="btn_house" onclick="setTool('house')"><span class="icon">🏠</span>Дом<br><small>100М</small></div>
                    <div class="tool-btn" id="btn_mall" onclick="setTool('mall')"><span class="icon">🏬</span>ТЦ<br><small>800М</small></div>
                    <div class="tool-btn" id="btn_admin" onclick="setTool('admin')"><span class="icon">🏢</span>Админ<br><small>500М</small></div>
                    <div class="tool-btn" id="btn_auto" onclick="setTool('auto')"><span class="icon">🏎️</span>Авто<br><small>1200М</small></div>
                    <div class="tool-btn" id="btn_clinic" onclick="setTool('clinic')"><span class="icon">🏥</span>Клиника<br><small>600М</small></div>
                    <div class="tool-btn" id="btn_factory" onclick="setTool('factory')"><span class="icon">🏭</span>Завод<br><small>400М</small></div>
                    <div class="tool-btn" id="btn_park" onclick="setTool('park')"><span class="icon">🌲</span>Парк<br><small>150М</small></div>
                    <div class="tool-btn" id="btn_eraser" onclick="setTool('eraser')"><span class="icon">❌</span>Снос</div>
                </div>
            </div>

            <div class="mode-switcher interactive">
                <button id="btnModeView" class="mode-btn active" onclick="setInteractionMode('view')">👁️ Обзор / Рынок</button>
                <button id="btnModeBuild" class="mode-btn" onclick="setInteractionMode('build')">🔨 Стройка</button>
            </div>
        </div>
    </div>

    <div id="propertyModal" class="interactive">
        <div class="modal-title">
            <span id="modalObjName">Управление объектом</span>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-info" id="modalObjInfo">
            Владелец: <b>Вы</b><br>
            Престиж района: <b>Элитный центр (x2.5 доход)</b><br>
            Доход: <b>+15 монет / сек</b>
        </div>
        <div class="price-input-group">
            <input type="number" id="sellPriceInput" class="price-input" placeholder="Цена продажи (монет)">
            <button class="modal-btn" onclick="savePropertyPrice()">Выставить на продажу</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        try { tg.expand(); if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch(e) {}

        let currentTool = 'house', interactionMode = 'view', draggedObject = null, selectedObject = null;
        let cameraRadius = 35, cameraHeight = 28;
        let playerBalance = 1500;
        const targetCenter = new THREE.Vector3(0, 0, 0);

        const buildingConfigs = {
            house: { name: 'Жилой дом', size: {w:1, h:1}, cost: 100, income: 3 },
            mall: { name: 'Торговый центр', size: {w:4, h:4}, cost: 800, income: 35 },
            admin: { name: 'Администрация', size: {w:3, h:3}, cost: 500, income: 20 },
            auto: { name: 'Автосалон', size: {w:3, h:3}, cost: 1200, income: 60 },
            clinic: { name: 'Клиника', size: {w:2, h:2}, cost: 600, income: 25 },
            factory: { name: 'Завод', size: {w:3, h:3}, cost: 400, income: 30 },
            park: { name: 'Парк отдыха', size: {w:2, h:2}, cost: 150, income: 5 },
            road: { name: 'Дорога', size: {w:1, h:1}, cost: 0, income: 0 }
        };

        function updateBalanceUI() {
            document.getElementById('balanceText').innerText = playerBalance.toLocaleString();
        }

        function setInteractionMode(mode) {
            interactionMode = mode;
            document.getElementById('btnModeView').classList.toggle('active', mode === 'view');
            document.getElementById('btnModeBuild').classList.toggle('active', mode === 'build');
            document.getElementById('buildPanel').classList.toggle('active', mode === 'build');
            document.getElementById('instructionText').innerText = mode === 'view' ? 
                'Режим обзора: кликните на постройку для открытия рынка.' : 
                'Режим постройки: выбирайте объекты внизу панели.';
            if (typeof gridHelper !== 'undefined') gridHelper.visible = (mode === 'build');
            if (mode === 'build') closeModal();
        }

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn_' + tool)?.classList.add('active');
            setInteractionMode('build');
        }

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a2420);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        function updateCameraPosition() {
            camera.position.set(targetCenter.x, cameraHeight, targetCenter.z + cameraRadius);
            camera.lookAt(targetCenter);
        }
        updateCameraPosition();

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xfff8ee, 0.9);
        dirLight.position.set(30, 40, 30);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const canvasTx = document.createElement('canvas');
        canvasTx.width = canvasTx.height = 512;
        const ctxTx = canvasTx.getContext('2d');
        ctxTx.fillStyle = '#3a6148'; ctxTx.fillRect(0, 0, 512, 512);
        for (let i = 0; i < 25000; i++) {
            ctxTx.fillStyle = Math.random() > 0.5 ? '#487556' : '#2f523b';
            ctxTx.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
        }
        const grassTex = new THREE.CanvasTexture(canvasTx);
        grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping;
        grassTex.repeat.set(25, 25);

        const ground = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.85 }));
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const gridHelper = new THREE.GridHelper(96, 80, 0xc5a059, 0x457555);
        gridHelper.position.y = 0.02;
        gridHelper.visible = false;
        scene.add(gridHelper);

        const placedObjects = [], CELL_SIZE = 1.2;
        const getObjectSize = (t) => buildingConfigs[t]?.size || {w:1, h:1};

        function createModel(type) {
            const group = new THREE.Group(), inner = new THREE.Group();
            const sz = getObjectSize(type);
            inner.position.set((sz.w * CELL_SIZE)/2 - CELL_SIZE/2, 0, (sz.h * CELL_SIZE)/2 - CELL_SIZE/2);
            group.add(inner);

            const mat = (col, r=0.5, m=0) => new THREE.MeshStandardMaterial({ color: col, roughness: r, metalness: m });

            if (type === 'road') {
                const r = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.03, 1.2), mat(0x44444d, 0.9));
                r.position.y = 0.015; r.receiveShadow = true;
                const s = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.035, 0.6), mat(0xcccccc));
                s.position.y = 0.02; inner.add(r, s);
            } else if (type === 'house') {
                const b = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.1, 1.1), mat(0xf5f5f5, 0.2));
                b.position.y = 0.55; b.castShadow = true;
                const rf = new THREE.Mesh(new THREE.ConeGeometry(0.9, 0.8, 4), mat(0xc84b31, 0.4));
                rf.position.y = 1.5; rf.rotation.y = Math.PI / 4; rf.castShadow = true;
                inner.add(b, rf);
            } else if (type === 'mall') {
                const body = new THREE.Mesh(new THREE.BoxGeometry(4.4, 3.2, 4.4), mat(0x181820, 0.2));
                body.position.y = 1.6; body.castShadow = true;
                const rf = new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.25, 4.6), mat(0xc5a059, 0.2, 0.6));
                rf.position.y = 3.32; rf.castShadow = true;
                inner.add(body, rf);
            } else if (type === 'admin') {
                const body = new THREE.Mesh(new THREE.BoxGeometry(3.2, 2.6, 3.2), mat(0x2a3530, 0.4));
                body.position.y = 1.3; body.castShadow = true;
                const sp = new THREE.Mesh(new THREE.ConeGeometry(0.45, 1.2, 4), mat(0xc5a059, 0.2, 0.7));
                sp.position.y = 3.55; inner.add(body, sp);
            } else if (type === 'auto') {
                const body = new THREE.Mesh(new THREE.BoxGeometry(3.4, 2.0, 3.4), mat(0x111118, 0.1, 0.8));
                body.position.y = 1.0; body.castShadow = true;
                const glass = new THREE.Mesh(new THREE.BoxGeometry(3.0, 1.0, 3.0), mat(0x33b5e5, 0.1));
                glass.position.y = 1.2; inner.add(body, glass);
            } else if (type === 'clinic') {
                const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 2.2, 2.2), mat(0xdddddd, 0.1));
                body.position.y = 1.1; body.castShadow = true;
                const cross = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.2), mat(0xff3838, 0.2));
                cross.position.set(0, 1.8, 1.15); inner.add(body, cross);
            } else if (type === 'factory') {
                const body = new THREE.Mesh(new THREE.BoxGeometry(3.2, 2.2, 3.2), mat(0x55555c, 0.8));
                body.position.y = 1.1; body.castShadow = true;
                const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 2.0), mat(0xcc3333, 0.5));
                pipe.position.set(1.0, 2.2, 1.0); inner.add(body, pipe);
            } else if (type === 'park') {
                const base = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.1, 2.3), mat(0x2e8b57, 0.9));
                base.position.y = 0.05;
                const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.12, 0.6), mat(0x6e4727));
                tr.position.set(0.5, 0.3, 0.5);
                const lf = new THREE.Mesh(new THREE.DodecahedronGeometry(0.4), mat(0x3cb371));
                lf.position.set(0.5, 0.7, 0.5); inner.add(base, tr, lf);
            }
            return group;
        }

        const SAVE_KEY = 'mossari_town_tycoon_v3';
        function saveGame() {
            localStorage.setItem(SAVE_KEY, JSON.stringify({
                balance: playerBalance,
                objects: placedObjects.map(i => ({ type: i.type, x: i.mesh.position.x, z: i.mesh.position.z, rotY: i.mesh.rotation.y, price: i.price || 0 }))
            }));
        }

        function loadGame() {
            const saved = localStorage.getItem(SAVE_KEY);
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    playerBalance = data.balance || 1500;
                    data.objects.forEach(d => {
                        const m = createModel(d.type);
                        m.position.set(d.x, 0, d.z);
                        if (d.rotY !== undefined) m.rotation.y = d.rotY;
                        scene.add(m);
                        placedObjects.push({ type: d.type, mesh: m, isRoad: d.type === 'road', price: d.price || 0 });
                    });
                    updateBalanceUI();
                    return;
                } catch(e) {}
            }
            for (let x = -36; x <= 36; x += CELL_SIZE) {
                for (let z = -36; z <= 36; z += CELL_SIZE) {
                    if (Math.abs(Math.round(x*10)%72) < 1 || Math.abs(Math.round(z*10)%72) < 1) {
                        const m = createModel('road'); m.position.set(x, 0, z);
                        scene.add(m); placedObjects.push({ type: 'road', mesh: m, isRoad: true });
                    }
                }
            }
            [
                {t:'house', x:-14.4, z:-14.4}, {t:'mall', x:-6.0, z:-14.4}, {t:'admin', x:2.4, z:-14.4},
                {t:'park', x:-14.4, z:-7.2}, {t:'house', x:2.4, z:-7.2}, {t:'factory', x:-14.4, z:2.4}
            ].forEach(b => {
                const m = createModel(b.t); m.position.set(b.x, 0, b.z);
                scene.add(m); placedObjects.push({ type: b.t, mesh: m, isRoad: false, price: 0 });
            });
            saveGame();
            updateBalanceUI();
        }

        function checkCollision(x, z, type, exclude = null) {
            const sz = getObjectSize(type);
            const [mx, mz, mxx, mzz] = [x - 0.05, z - 0.05, x + sz.w * CELL_SIZE - 0.05, z + sz.h * CELL_SIZE - 0.05];
            return placedObjects.some(item => {
                if (item === exclude) return false;
                const osz = getObjectSize(item.type);
                const [ox, oz, oxx, ozz] = [item.mesh.position.x, item.mesh.position.z, item.mesh.position.x + osz.w * CELL_SIZE, item.mesh.position.z + osz.h * CELL_SIZE];
                return mx < oxx && mxx > ox && mz < ozz && mzz > oz;
            });
        }

        const raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2();
        let isDragging = false, prevMouse = {x: 0, y: 0}, pinchDist = null, startRad = cameraRadius, startH = cameraHeight;

        function getPointerPos(e) { return e.touches ? e.touches[0] : e; }

        function onPointerDown(e) {
            if (e.target.closest('.interactive')) return;
            const p = getPointerPos(e);
            
            if (e.touches && e.touches.length === 2) {
                isDragging = false;
                pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                startRad = cameraRadius; startH = cameraHeight;
                return;
            }

            mouse.set((p.clientX / window.innerWidth) * 2 - 1, -(p.clientY / window.innerHeight) * 2 + 1);
            raycaster.setFromCamera(mouse, camera);

            if (interactionMode === 'view') {
                const hitObj = raycaster.intersectObjects(placedObjects.map(i => i.mesh), true)[0];
                if (hitObj) {
                    let obj = hitObj.object;
                    while (obj.parent && obj.parent !== scene) {
                        const found = placedObjects.find(i => i.mesh === obj.parent);
                        if (found && !found.isRoad) {
                            openPropertyModal(found);
                            break;
                        }
                        obj = obj.parent;
                    }
                }
                isDragging = true;
                prevMouse = { x: p.clientX, y: p.clientY };
                return;
            }

            if (interactionMode === 'build') {
                if (currentTool === 'eraser') {
                    const hits = raycaster.intersectObject(ground);
                    if (hits.length > 0) {
                        let idx = -1, minDist = 2;
                        placedObjects.forEach((item, i) => {
                            if (item.isRoad) return;
                            const sz = getObjectSize(item.type);
                            const d = Math.hypot(hits[0].point.x - (item.mesh.position.x + sz.w*CELL_SIZE/2), hits[0].point.z - (item.mesh.position.z + sz.h*CELL_SIZE/2));
                            if (d < minDist) { minDist = d; idx = i; }
                        });
                        if (idx !== -1) { 
                            scene.remove(placedObjects[idx].mesh); 
                            const removedType = placedObjects[idx].type;
                            placedObjects.splice(idx, 1); 
                            playerBalance += Math.floor((buildingConfigs[removedType]?.cost || 100) * 0.5);
                            updateBalanceUI();
                            saveGame(); 
                        }
                    }
                    return;
                }

                const config = buildingConfigs[currentTool];
                if (playerBalance < config.cost) {
                    alert('Недостаточно монет для покупки!');
                    return;
                }

                const hitsGround = raycaster.intersectObject(ground);
                if (hitsGround.length > 0) {
                    const x = Math.round(hitsGround[0].point.x / CELL_SIZE) * CELL_SIZE;
                    const z = Math.round(hitsGround[0].point.z / CELL_SIZE) * CELL_SIZE;
                    if (!checkCollision(x, z, currentTool)) {
                        playerBalance -= config.cost;
                        updateBalanceUI();
                        const m = createModel(currentTool); m.position.set(x, 0, z);
                        scene.add(m); 
                        const newObj = { type: currentTool, mesh: m, isRoad: false, price: 0 };
                        placedObjects.push(newObj);
                        saveGame();
                    }
                }
            }

            isDragging = true;
            prevMouse = { x: p.clientX, y: p.clientY };
        }

        function openPropertyModal(obj) {
            selectedObject = obj;
            const config = buildingConfigs[obj.type];
            const distFromCenter = Math.hypot(obj.mesh.position.x, obj.mesh.position.z);
            let prestige = distFromCenter < 10 ? 'Элитный центр (x2.5 доход)' : (distFromCenter < 25 ? 'Стандартный район (x1.5 доход)' : 'Окраина (x1.0 доход)');
            let mult = distFromCenter < 10 ? 2.5 : (distFromCenter < 25 ? 1.5 : 1.0);
            let income = Math.round(config.income * mult);

            document.getElementById('modalObjName').innerText = config.name;
            document.getElementById('modalObjInfo').innerHTML = `Владелец: <b>Вы</b><br>Престиж: <b>${prestige}</b><br>Доход: <b>+${income} монет / сек</b>`;
            document.getElementById('sellPriceInput').value = obj.price || (config.cost * 2);
            document.getElementById('propertyModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('propertyModal').classList.remove('active');
            selectedObject = null;
        }

        function savePropertyPrice() {
            if (!selectedObject) return;
            const val = parseInt(document.getElementById('sellPriceInput').value);
            selectedObject.price = isNaN(val) ? 0 : val;
            saveGame();
            alert(`Участок успешно выставлен на рынок по цене ${selectedObject.price} монет!`);
            closeModal();
        }

        function onPointerMove(e) {
            const p = getPointerPos(e);
            if (e.touches && e.touches.length === 2 && pinchDist !== null) {
                const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                const scale = pinchDist / dist;
                cameraRadius = Math.max(10, Math.min(65, startRad * scale));
                cameraHeight = Math.max(8, Math.min(55, startH * scale));
                updateCameraPosition();
                return;
            }

            if (!isDragging) return;
            targetCenter.x = Math.max(-45, Math.min(45, targetCenter.x - (p.clientX - prevMouse.x) * 0.04));
            targetCenter.z = Math.max(-45, Math.min(45, targetCenter.z - (p.clientY - prevMouse.y) * 0.04));
            updateCameraPosition();
            prevMouse = { x: p.clientX, y: p.clientY };
        }

        function onPointerUp() {
            pinchDist = null;
            isDragging = false;
        }

        setInterval(() => {
            let totalIncome = 0;
            placedObjects.forEach(obj => {
                if (obj.isRoad) return;
                const config = buildingConfigs[obj.type];
                if (!config) return;
                const dist = Math.hypot(obj.mesh.position.x, obj.mesh.position.z);
                const mult = dist < 10 ? 2.5 : (dist < 25 ? 1.5 : 1.0);
                totalIncome += Math.round(config.income * mult);
            });
            playerBalance += totalIncome;
            updateBalanceUI();
            saveGame();
        }, 1000);

        window.addEventListener('touchstart', onPointerDown, {passive: false});
        window.addEventListener('touchmove', onPointerMove, {passive: false});
        window.addEventListener('touchend', onPointerUp);
        window.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
        window.addEventListener('wheel', (e) => {
            cameraRadius = Math.max(10, Math.min(65, cameraRadius + e.deltaY * 0.03));
            cameraHeight = Math.max(8, Math.min(55, cameraHeight + e.deltaY * 0.025));
            updateCameraPosition();
        }, {passive: true});

        loadGame();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        (function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        })();
    </script>
</body>
</html>
