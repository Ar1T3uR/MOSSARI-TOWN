<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mossari Town</title>
    <!-- Подключаем официальный скрипт Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #1a1a24);
            color: var(--tg-theme-text-color, #ffffff);
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 20px;
        }

        .interactive {
            pointer-events: auto;
        }

        header {
            background: rgba(20, 20, 28, 0.85);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .brand-logo {
            font-weight: 800;
            letter-spacing: 2px;
            font-size: 16px;
            text-transform: uppercase;
        }

        .brand-logo span {
            color: #c5a059;
        }

        .user-info {
            font-size: 13px;
            font-weight: 600;
            color: #c5a059;
            background: rgba(197, 160, 89, 0.15);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(197, 160, 89, 0.3);
        }

        .bottom-ui {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .sub-menu {
            display: none;
            background: rgba(20, 20, 28, 0.9);
            backdrop-filter: blur(12px);
            padding: 8px;
            border-radius: 16px;
            gap: 8px;
            border: 1px solid rgba(197, 160, 89, 0.3);
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            animation: fadeIn 0.2s ease-in-out;
        }

        .sub-menu.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .toolbar {
            background: rgba(20, 20, 28, 0.85);
            backdrop-filter: blur(12px);
            padding: 10px 14px;
            border-radius: 20px;
            display: flex;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.08);
            max-width: 480px;
            margin: 0 auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            overflow-x: auto;
        }

        .tool-btn {
            background: rgba(255,255,255,0.04);
            border: 2px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 8px 8px;
            flex: 1;
            min-width: 65px;
            text-align: center;
            cursor: pointer;
            color: white;
            transition: all 0.2s;
            font-size: 10px;
            font-weight: 600;
        }

        .tool-btn.active {
            border-color: #c5a059;
            background: rgba(197, 160, 89, 0.2);
            transform: translateY(-2px);
        }

        .tool-btn .icon {
            font-size: 18px;
            display: block;
            margin-bottom: 3px;
        }

        /* Кнопки зума справа сбоку */
        .zoom-controls {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .zoom-btn {
            width: 48px;
            height: 48px;
            background: rgba(20, 20, 28, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            transition: all 0.15s ease;
        }

        .zoom-btn:active {
            transform: scale(0.92);
            background: rgba(197, 160, 89, 0.3);
            border-color: #c5a059;
        }

        .instruction {
            text-align: center;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 12px;
            margin-bottom: 6px;
            align-self: center;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.05);
        }
    </style>

    <!-- Подключаем Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- Кнопки зума справа сбоку -->
    <div class="zoom-controls interactive">
        <div class="zoom-btn" onclick="zoomIn()">+</div>
        <div class="zoom-btn" onclick="zoomOut()">−</div>
    </div>

    <div class="ui-layer">
        <header class="interactive">
            <div class="brand-logo">mossari <span>town</span></div>
            <div class="user-info" id="username">Гость</div>
        </header>

        <div class="bottom-ui">
            <div class="instruction">Добавлен современный ТЦ Mossari! Карту можно двигать пальцем.</div>
            
            <!-- Выпадающее подменю для 4 вариантов заборов -->
            <div id="fenceSubMenu" class="sub-menu interactive">
                <div class="tool-btn" id="btn_fence_wood" onclick="selectFence('fence_wood')">
                    <span class="icon">🪵</span>Дерево
                </div>
                <div class="tool-btn" id="btn_fence_stone" onclick="selectFence('fence_stone')">
                    <span class="icon">🏛️</span>Бордюр
                </div>
                <div class="tool-btn" id="btn_fence_hedge" onclick="selectFence('fence_hedge')">
                    <span class="icon">🌿</span>Изгородь
                </div>
                <div class="tool-btn" id="btn_fence_mossari" onclick="selectFence('fence_mossari')">
                    <span class="icon">✨</span>Mossari
                </div>
            </div>

            <!-- Главная панель инструментов -->
            <div class="toolbar interactive">
                <div class="tool-btn active" id="btn_house" onclick="setTool('house')">
                    <span class="icon">🏠</span>Дом
                </div>
                <div class="tool-btn" id="btn_mall" onclick="setTool('mall')">
                    <span class="icon">🏬</span>ТЦ
                </div>
                <div class="tool-btn" id="btn_tree" onclick="setTool('tree')">
                    <span class="icon">🌲</span>Дерево
                </div>
                <div class="tool-btn" id="btn_fence_main" onclick="toggleFenceMenu()">
                    <span class="icon">🚧</span>Забор
                </div>
                <div class="tool-btn" id="btn_eraser" onclick="setTool('eraser')">
                    <span class="icon">❌</span>Удалить
                </div>
            </div>
        </div>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('username').innerText = user.first_name || 'Житель';
        }

        let currentTool = 'house';

        // Управление подменю заборов
        function toggleFenceMenu() {
            const subMenu = document.getElementById('fenceSubMenu');
            subMenu.classList.toggle('active');
        }

        function selectFence(fenceType) {
            setTool(fenceType);
            const icons = {
                'fence_wood': '🪵',
                'fence_stone': '🏛️',
                'fence_hedge': '🌿',
                'fence_mossari': '✨'
            };
            document.getElementById('btn_fence_main').querySelector('.icon').innerText = icons[fenceType];
            document.getElementById('fenceSubMenu').classList.remove('active');
        }

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            
            if (tool.startsWith('fence_')) {
                document.getElementById('btn_fence_main').classList.add('active');
                document.getElementById('btn_' + tool).classList.add('active');
            } else {
                const btn = document.getElementById('btn_' + tool);
                if (btn) btn.classList.add('active');
                if (!tool.startsWith('fence_')) {
                    document.getElementById('fenceSubMenu').classList.remove('active');
                }
            }
        }

        // Инициализация Three.js 3D мира
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x12121a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        let cameraRadius = 28;
        let cameraAngle = 0;
        let cameraHeight = 25;
        
        // Центр камеры для перемещения карты (панорамирования)
        const targetCenter = new THREE.Vector3(0, 0, 0);

        function updateCameraPosition() {
            camera.position.x = targetCenter.x + Math.sin(cameraAngle) * cameraRadius;
            camera.position.z = targetCenter.z + Math.cos(cameraAngle) * cameraRadius;
            camera.position.y = cameraHeight;
            camera.lookAt(targetCenter);
        }
        updateCameraPosition();

        // Функции кнопок зума справа
        function zoomIn() {
            cameraRadius -= 3;
            if (cameraRadius < 8) cameraRadius = 8;
            cameraHeight = cameraRadius * 0.9;
            updateCameraPosition();
        }

        function zoomOut() {
            cameraRadius += 3;
            if (cameraRadius > 48) cameraRadius = 48;
            cameraHeight = cameraRadius * 0.9;
            updateCameraPosition();
        }

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfff5e6, 0.9);
        dirLight.position.set(25, 35, 25);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Увеличенная лужайка (50x50)
        const groundGeo = new THREE.PlaneGeometry(50, 50);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x24342b, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const placedObjects = [];

        // Создание моделей
        function createModel(type) {
            const group = new THREE.Group();

            if (type === 'house') {
                const baseMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.2 });
                const baseGeo = new THREE.BoxGeometry(1.4, 1.1, 1.4);
                const base = new THREE.Mesh(baseGeo, baseMat);
                base.position.y = 0.55;
                base.castShadow = true;
                group.add(base);

                const roofMat = new THREE.MeshStandardMaterial({ color: 0xc84b31, roughness: 0.4 });
                const roofGeo = new THREE.ConeGeometry(1.1, 0.9, 4);
                const roof = new THREE.Mesh(roofGeo, roofMat);
                roof.position.y = 1.55;
                roof.rotation.y = Math.PI / 4;
                roof.castShadow = true;
                group.add(roof);

                const doorMat = new THREE.MeshStandardMaterial({ color: 0x5a3d28 });
                const doorGeo = new THREE.BoxGeometry(0.35, 0.55, 0.05);
                const door = new THREE.Mesh(doorGeo, doorMat);
                door.position.set(0, 0.28, 0.71);
                group.add(door);

                const windowMat = new THREE.MeshStandardMaterial({ color: 0x33b5e5, roughness: 0.1 });
                const winGeo = new THREE.BoxGeometry(0.3, 0.3, 0.05);
                
                const win1 = new THREE.Mesh(winGeo, windowMat);
                win1.position.set(-0.38, 0.7, 0.71);
                group.add(win1);

                const win2 = new THREE.Mesh(winGeo, windowMat);
                win2.position.set(0.38, 0.7, 0.71);
                group.add(win2);
            } 
            // 🏬 Современный Торговый Центр Mossari
            else if (type === 'mall') {
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0x181820, roughness: 0.2 });
                const bodyGeo = new THREE.BoxGeometry(2.4, 1.6, 2.0);
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.y = 0.8;
                body.castShadow = true;
                group.add(body);

                const glassMat = new THREE.MeshStandardMaterial({ color: 0x4090b0, roughness: 0.1, transparent: true, opacity: 0.7 });
                const glassGeo = new THREE.BoxGeometry(2.0, 0.9, 2.05);
                const glass = new THREE.Mesh(glassGeo, glassMat);
                glass.position.y = 0.65;
                group.add(glass);

                const roofMat = new THREE.MeshStandardMaterial({ color: 0xc5a059, metalness: 0.6, roughness: 0.2 });
                const roofGeo = new THREE.BoxGeometry(2.6, 0.15, 2.2);
                const roof = new THREE.Mesh(roofGeo, roofMat);
                roof.position.y = 1.67;
                roof.castShadow = true;
                group.add(roof);

                const topBoxGeo = new THREE.BoxGeometry(1.2, 0.4, 1.0);
                const topBox = new THREE.Mesh(topBoxGeo, bodyMat);
                topBox.position.set(0, 1.95, 0);
                group.add(topBox);

                const signMat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0x554000 });
                const signGeo = new THREE.BoxGeometry(0.8, 0.12, 1.05);
                const sign = new THREE.Mesh(signGeo, signMat);
                sign.position.set(0, 2.2, 0);
                group.add(sign);
            }
            else if (type === 'tree') {
                const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6e4727 });
                const trunkGeo = new THREE.CylinderGeometry(0.1, 0.15, 0.8);
                const trunk = new THREE.Mesh(trunkGeo, trunkMat);
                trunk.position.y = 0.4;
                trunk.castShadow = true;
                group.add(trunk);

                const leavesMat1 = new THREE.MeshStandardMaterial({ color: 0x2e8b57, roughness: 0.7 });
                const leavesMat2 = new THREE.MeshStandardMaterial({ color: 0x3cb371, roughness: 0.7 });

                const sphereGeo1 = new THREE.DodecahedronGeometry(0.65);
                const leafCluster1 = new THREE.Mesh(sphereGeo1, leavesMat1);
                leafCluster1.position.y = 1.0;
                leafCluster1.castShadow = true;
                group.add(leafCluster1);

                const sphereGeo2 = new THREE.DodecahedronGeometry(0.45);
                const leafCluster2 = new THREE.Mesh(sphereGeo2, leavesMat2);
                leafCluster2.position.set(0.25, 1.25, 0.1);
                leafCluster2.castShadow = true;
                group.add(leafCluster2);

                const leafCluster3 = new THREE.Mesh(sphereGeo2, leavesMat2);
                leafCluster3.position.set(-0.2, 1.15, -0.2);
                leafCluster3.castShadow = true;
                group.add(leafCluster3);
            }
            else if (type === 'fence_wood') {
                const woodMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.8 });
                for (let i = -0.5; i <= 0.5; i += 0.35) {
                    const postGeo = new THREE.BoxGeometry(0.1, 0.6, 0.1);
                    const post = new THREE.Mesh(postGeo, woodMat);
                    post.position.set(i, 0.3, 0);
                    group.add(post);
                }
                const beamGeo1 = new THREE.BoxGeometry(1.2, 0.08, 0.05);
                const beam1 = new THREE.Mesh(beamGeo1, woodMat);
                beam1.position.set(0, 0.45, 0);
                group.add(beam1);

                const beam2 = new THREE.Mesh(beamGeo1, woodMat);
                beam2.position.set(0, 0.15, 0);
                group.add(beam2);
            }
            else if (type === 'fence_stone') {
                const stoneMat = new THREE.MeshStandardMaterial({ color: 0x707070, roughness: 0.6 });
                const stoneGeo = new THREE.BoxGeometry(1.2, 0.4, 0.3);
                const stone = new THREE.Mesh(stoneGeo, stoneMat);
                stone.position.y = 0.2;
                stone.castShadow = true;
                group.add(stone);
            }
            else if (type === 'fence_hedge') {
                const hedgeMat = new THREE.MeshStandardMaterial({ color: 0x2e6b3e, roughness: 0.9 });
                const hedgeGeo = new THREE.BoxGeometry(1.2, 0.7, 0.4);
                const hedge = new THREE.Mesh(hedgeGeo, hedgeMat);
                hedge.position.y = 0.35;
                hedge.castShadow = true;
                group.add(hedge);
            }
            else if (type === 'fence_mossari') {
                const baseMat = new THREE.MeshStandardMaterial({ color: 0x181818, roughness: 0.3 });
                const goldMat = new THREE.MeshStandardMaterial({ color: 0xc5a059, metalness: 0.7, roughness: 0.2 });

                const barGeo = new THREE.BoxGeometry(1.2, 0.5, 0.15);
                const bar = new THREE.Mesh(barGeo, baseMat);
                bar.position.y = 0.25;
                group.add(bar);

                const topGeo = new THREE.BoxGeometry(1.25, 0.08, 0.2);
                const top = new THREE.Mesh(topGeo, goldMat);
                top.position.y = 0.52;
                group.add(top);
            }

            return group;
        }

        // --- СОХРАНЕНИЕ И ЗАГРУЗКА ---
        const SAVE_KEY = 'mossari_town_save_v4';

        function saveGame() {
            const dataToSave = placedObjects.map(item => ({
                type: item.type,
                x: item.mesh.position.x,
                z: item.mesh.position.z,
                rotY: item.mesh.rotation.y
            }));
            localStorage.setItem(SAVE_KEY, JSON.stringify(dataToSave));
        }

        function loadGame() {
            let savedData = localStorage.getItem(SAVE_KEY);
            if (!savedData) {
                savedData = localStorage.getItem('mossari_town_save_v3') || localStorage.getItem('mossari_town_save_v2') || localStorage.getItem('mossari_town_save');
            }

            if (savedData) {
                try {
                    const parsed = JSON.parse(savedData);
                    parsed.forEach(data => {
                        let t = data.type;
                        if (t === 'fence') t = 'fence_wood';
                        
                        const model = createModel(t);
                        model.position.set(data.x, 0, data.z);
                        if (data.rotY !== undefined) model.rotation.y = data.rotY;
                        scene.add(model);
                        placedObjects.push({ type: t, mesh: model });
                    });
                } catch(e) {
                    console.error("Ошибка загрузки сохранения", e);
                }
            }
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        let isDragging = false;
        let hasMoved = false;
        let pointerDownPos = { x: 0, y: 0 };
        let previousMousePosition = { x: 0, y: 0 };

        // Перемещение карты (панорамирование) одним пальцем / мышкой
        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.interactive') || e.target.closest('.zoom-controls')) return;
            isDragging = true;
            hasMoved = false;
            pointerDownPos = { x: e.clientX, y: e.clientY };
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;

            const dx = e.clientX - pointerDownPos.x;
            const dy = e.clientY - pointerDownPos.y;
            if (Math.sqrt(dx * dx + dy * dy) > 5) {
                hasMoved = true;
            }

            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            // Панорамирование карты по плоскости XZ с учетом угла камеры
            const panSpeed = 0.02 * (cameraRadius * 0.05);
            const angle = cameraAngle;
            
            targetCenter.x -= (deltaX * Math.cos(angle) - deltaY * Math.sin(angle)) * panSpeed;
            targetCenter.z -= (deltaX * Math.sin(angle) + deltaY * Math.cos(angle)) * panSpeed;

            updateCameraPosition();
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointerup', (e) => {
            if (!isDragging) return;
            isDragging = false;

            if (!hasMoved) {
                if (e.target.closest('.interactive') || e.target.closest('header') || e.target.closest('.zoom-controls')) {
                    return;
                }

                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(ground);

                if (intersects.length > 0) {
                    const intersect = intersects[0];

                    if (currentTool === 'eraser') {
                        if (placedObjects.length > 0) {
                            let closestObj = null;
                            let minDist = 1.2;
                            let closestIndex = -1;

                            placedObjects.forEach((item, idx) => {
                                const dist = item.mesh.position.distanceTo(intersect.point);
                                if (dist < minDist) {
                                    minDist = dist;
                                    closestObj = item;
                                    closestIndex = idx;
                                }
                            });

                            if (closestObj) {
                                scene.remove(closestObj.mesh);
                                placedObjects.splice(closestIndex, 1);
                                saveGame();
                            }
                        }
                    } else {
                        // Постройка с автоматическим соединением заборов (snapping & alignment)
                        let posX = intersect.point.x;
                        let posZ = intersect.point.z;
                        let snapRotation = 0;

                        if (currentTool.startsWith('fence_')) {
                            // Привязка к сетке с шагом 1.2 для идеальной стыковки заборов
                            const step = 1.2;
                            const gridX = Math.round(posX / step) * step;
                            const gridZ = Math.round(posZ / step) * step;

                            // Находим ближайший предыдущий забор, чтобы красиво повернуть новый забор для стыковки
                            let nearestFence = null;
                            let minD = 2.0;
                            placedObjects.forEach(item => {
                                if (item.type.startsWith('fence_')) {
                                    const d = item.mesh.position.distanceTo(new THREE.Vector3(gridX, 0, gridZ));
                                    if (d < minD) {
                                        minD = d;
                                        nearestFence = item;
                                    }
                                });
                            });

                            if (nearestFence) {
                                const dx = gridX - nearestFence.mesh.position.x;
                                const dz = gridZ - nearestFence.mesh.position.z;
                                if (Math.abs(dx) > Math.abs(dz)) {
                                    snapRotation = Math.PI / 2;
                                }
                            }
                            posX = gridX;
                            posZ = gridZ;
                        }

                        // Проверка на наложение объектов
                        let tooClose = false;
                        placedObjects.forEach(item => {
                            const minDist = currentTool.startsWith('fence_') ? 0.8 : (currentTool === 'mall' ? 2.0 : 1.0);
                            if (item.mesh.position.distanceTo(new THREE.Vector3(posX, 0, posZ)) < minDist) {
                                tooClose = true;
                            }
                        });

                        if (!tooClose) {
                            const model = createModel(currentTool);
                            model.position.set(posX, 0, posZ);
                            if (currentTool.startsWith('fence_')) {
                                model.rotation.y = snapRotation;
                            }
                            scene.add(model);
                            placedObjects.push({ type: currentTool, mesh: model });
                            saveGame();
                        }
                    }
                }
            }
        });

        // Плавный зум колесиком мыши
        window.addEventListener('wheel', (e) => {
            cameraRadius += e.deltaY * 0.03;
            if (cameraRadius < 8) cameraRadius = 8;
            if (cameraRadius > 48) cameraRadius = 48;

            cameraHeight = cameraRadius * 0.9;
            updateCameraPosition();
        }, { passive: true });

        // Зумирование щипком двумя пальцами на мобильных
        let initialTouchDist = 0;
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                initialTouchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                const currentDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const diff = initialTouchDist - currentDist;
                cameraRadius += diff * 0.05;
                if (cameraRadius < 8) cameraRadius = 8;
                if (cameraRadius > 48) cameraRadius = 48;

                cameraHeight = cameraRadius * 0.9;
                updateCameraPosition();
                initialTouchDist = currentDist;
            }
        });

        // Загружаем сохраненный мир при старте
        loadGame();

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
