<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mossari Town</title>
    <!-- Подключаем официальный скрипт Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #1a1a24);
            color: var(--tg-theme-text-color, #ffffff);
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 20px;
        }

        .interactive {
            pointer-events: auto;
        }

        header {
            background: rgba(20, 20, 28, 0.85);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .brand-logo {
            font-weight: 800;
            letter-spacing: 2px;
            font-size: 16px;
            text-transform: uppercase;
        }

        .brand-logo span {
            color: #c5a059;
        }

        .user-info {
            font-size: 13px;
            font-weight: 600;
            color: #c5a059;
            background: rgba(197, 160, 89, 0.15);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(197, 160, 89, 0.3);
        }

        .toolbar {
            background: rgba(20, 20, 28, 0.85);
            backdrop-filter: blur(12px);
            padding: 12px;
            border-radius: 20px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            border: 1px solid rgba(255,255,255,0.08);
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        .tool-btn {
            background: rgba(255,255,255,0.04);
            border: 2px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 8px 6px;
            flex: 1;
            min-width: 68px;
            text-align: center;
            cursor: pointer;
            color: white;
            transition: all 0.2s;
            font-size: 10px;
            font-weight: 600;
        }

        .tool-btn.active {
            border-color: #c5a059;
            background: rgba(197, 160, 89, 0.2);
            transform: translateY(-2px);
        }

        .tool-btn .icon {
            font-size: 18px;
            display: block;
            margin-bottom: 3px;
        }

        .instruction {
            text-align: center;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 12px;
            margin-bottom: 12px;
            align-self: center;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.05);
        }
    </style>

    <!-- Подключаем Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <header class="interactive">
            <div class="brand-logo">mossari <span>town</span></div>
            <div class="user-info" id="username">Гость</div>
        </header>

        <div style="display: flex; flex-direction: column; width: 100%;">
            <div class="instruction">Зумируйте карту скроллом/щипком, выбирайте заборы и стройте мир!</div>
            
            <div class="toolbar interactive">
                <div class="tool-btn active" onclick="setTool('house')">
                    <span class="icon">🏠</span>Дом
                </div>
                <div class="tool-btn" onclick="setTool('tree')">
                    <span class="icon">🌲</span>Дерево
                </div>
                <div class="tool-btn" onclick="setTool('fence_wood')">
                    <span class="icon">🪵</span>Дерево забор
                </div>
                <div class="tool-btn" onclick="setTool('fence_stone')">
                    <span class="icon">🏛️</span>Бордюр
                </div>
                <div class="tool-btn" onclick="setTool('fence_hedge')">
                    <span class="icon">🌿</span>Изгородь
                </div>
                <div class="tool-btn" onclick="setTool('fence_mossari')">
                    <span class="icon">✨</span>Mossari
                </div>
                <div class="tool-btn" onclick="setTool('eraser')">
                    <span class="icon">❌</span>Удалить
                </div>
            </div>
        </div>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('username').innerText = user.first_name || 'Житель';
        }

        let currentTool = 'house';

        // Инициализация Three.js 3D мира
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x12121a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        // Параметры камеры для управления зумом и вращением
        let cameraRadius = 25; // Дистанция от центра (больше радиус — шире обзор)
        let cameraAngle = 0;   // Угол вращения вокруг оси Y
        let cameraHeight = 22; // Высота камеры

        function updateCameraPosition() {
            camera.position.x = Math.sin(cameraAngle) * cameraRadius;
            camera.position.z = Math.cos(cameraAngle) * cameraRadius;
            camera.position.y = cameraHeight;
            camera.lookAt(0, 0, 0);
        }
        updateCameraPosition();

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfff5e6, 0.9);
        dirLight.position.set(25, 35, 25);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Увеличенная лужайка (50x50 вместо 30x30)
        const groundGeo = new THREE.PlaneGeometry(50, 50);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x24342b, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const placedObjects = [];

        // Создание моделей (Дом, Дерево и 4 вида забора)
        function createModel(type) {
            const group = new THREE.Group();

            if (type === 'house') {
                const baseMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.2 });
                const baseGeo = new THREE.BoxGeometry(1.4, 1.1, 1.4);
                const base = new THREE.Mesh(baseGeo, baseMat);
                base.position.y = 0.55;
                base.castShadow = true;
                group.add(base);

                const roofMat = new THREE.MeshStandardMaterial({ color: 0xc84b31, roughness: 0.4 });
                const roofGeo = new THREE.ConeGeometry(1.1, 0.9, 4);
                const roof = new THREE.Mesh(roofGeo, roofMat);
                roof.position.y = 1.55;
                roof.rotation.y = Math.PI / 4;
                roof.castShadow = true;
                group.add(roof);

                const doorMat = new THREE.MeshStandardMaterial({ color: 0x5a3d28 });
                const doorGeo = new THREE.BoxGeometry(0.35, 0.55, 0.05);
                const door = new THREE.Mesh(doorGeo, doorMat);
                door.position.set(0, 0.28, 0.71);
                group.add(door);

                const windowMat = new THREE.MeshStandardMaterial({ color: 0x33b5e5, roughness: 0.1 });
                const winGeo = new THREE.BoxGeometry(0.3, 0.3, 0.05);
                
                const win1 = new THREE.Mesh(winGeo, windowMat);
                win1.position.set(-0.38, 0.7, 0.71);
                group.add(win1);

                const win2 = new THREE.Mesh(winGeo, windowMat);
                win2.position.set(0.38, 0.7, 0.71);
                group.add(win2);
            } 
            else if (type === 'tree') {
                const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6e4727 });
                const trunkGeo = new THREE.CylinderGeometry(0.1, 0.15, 0.8);
                const trunk = new THREE.Mesh(trunkGeo, trunkMat);
                trunk.position.y = 0.4;
                trunk.castShadow = true;
                group.add(trunk);

                const leavesMat1 = new THREE.MeshStandardMaterial({ color: 0x2e8b57, roughness: 0.7 });
                const leavesMat2 = new THREE.MeshStandardMaterial({ color: 0x3cb371, roughness: 0.7 });

                const sphereGeo1 = new THREE.DodecahedronGeometry(0.65);
                const leafCluster1 = new THREE.Mesh(sphereGeo1, leavesMat1);
                leafCluster1.position.y = 1.0;
                leafCluster1.castShadow = true;
                group.add(leafCluster1);

                const sphereGeo2 = new THREE.DodecahedronGeometry(0.45);
                const leafCluster2 = new THREE.Mesh(sphereGeo2, leavesMat2);
                leafCluster2.position.set(0.25, 1.25, 0.1);
                leafCluster2.castShadow = true;
                group.add(leafCluster2);

                const leafCluster3 = new THREE.Mesh(sphereGeo2, leavesMat2);
                leafCluster3.position.set(-0.2, 1.15, -0.2);
                leafCluster3.castShadow = true;
                group.add(leafCluster3);
            }
            // 1. Деревянный забор
            else if (type === 'fence_wood') {
                const woodMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.8 });
                // Секция забора
                for (let i = -0.5; i <= 0.5; i += 0.35) {
                    const postGeo = new THREE.BoxGeometry(0.1, 0.6, 0.1);
                    const post = new THREE.Mesh(postGeo, woodMat);
                    post.position.set(i, 0.3, 0);
                    group.add(post);
                }
                const beamGeo1 = new THREE.BoxGeometry(1.2, 0.08, 0.05);
                const beam1 = new THREE.Mesh(beamGeo1, woodMat);
                beam1.position.set(0, 0.45, 0);
                group.add(beam1);

                const beam2 = new THREE.Mesh(beamGeo1, woodMat);
                beam2.position.set(0, 0.15, 0);
                group.add(beam2);
            }
            // 2. Каменный бордюр
            else if (type === 'fence_stone') {
                const stoneMat = new THREE.MeshStandardMaterial({ color: 0x707070, roughness: 0.6 });
                const stoneGeo = new THREE.BoxGeometry(1.2, 0.4, 0.3);
                const stone = new THREE.Mesh(stoneGeo, stoneMat);
                stone.position.y = 0.2;
                stone.castShadow = true;
                group.add(stone);
            }
            // 3. Зеленая живая изгородь
            else if (type === 'fence_hedge') {
                const hedgeMat = new THREE.MeshStandardMaterial({ color: 0x2e6b3e, roughness: 0.9 });
                const hedgeGeo = new THREE.BoxGeometry(1.2, 0.7, 0.4);
                const hedge = new THREE.Mesh(hedgeGeo, hedgeMat);
                hedge.position.y = 0.35;
                hedge.castShadow = true;
                group.add(hedge);
            }
            // 4. Премиум ограда Mossari (Черная с золотом)
            else if (type === 'fence_mossari') {
                const baseMat = new THREE.MeshStandardMaterial({ color: 0x181818, roughness: 0.3 });
                const goldMat = new THREE.MeshStandardMaterial({ color: 0xc5a059, metalness: 0.7, roughness: 0.2 });

                const barGeo = new THREE.BoxGeometry(1.2, 0.5, 0.15);
                const bar = new THREE.Mesh(barGeo, baseMat);
                bar.position.y = 0.25;
                group.add(bar);

                const topGeo = new THREE.BoxGeometry(1.25, 0.08, 0.2);
                const top = new THREE.Mesh(topGeo, goldMat);
                top.position.y = 0.52;
                group.add(top);
            }

            return group;
        }

        // --- СОХРАНЕНИЕ И ЗАГРУЗКА ---
        function saveGame() {
            const dataToSave = placedObjects.map(item => ({
                type: item.type,
                x: item.mesh.position.x,
                z: item.mesh.position.z
            }));
            localStorage.setItem('mossari_town_save_v3', JSON.stringify(dataToSave));
        }

        function loadGame() {
            const savedData = localStorage.getItem('mossari_town_save_v3');
            if (savedData) {
                try {
                    const parsed = JSON.parse(savedData);
                    parsed.forEach(data => {
                        const model = createModel(data.type);
                        model.position.set(data.x, 0, data.z);
                        scene.add(model);
                        placedObjects.push({ type: data.type, mesh: model });
                    });
                } catch(e) {
                    console.error("Ошибка загрузки сохранения", e);
                }
            }
        }

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        let isDragging = false;
        let hasMoved = false;
        let pointerDownPos = { x: 0, y: 0 };
        let previousMousePosition = { x: 0, y: 0 };

        // Обработка вращения мыши / пальца
        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.interactive')) return;
            isDragging = true;
            hasMoved = false;
            pointerDownPos = { x: e.clientX, y: e.clientY };
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;

            const dx = e.clientX - pointerDownPos.x;
            const dy = e.clientY - pointerDownPos.y;
            if (Math.sqrt(dx * dx + dy * dy) > 5) {
                hasMoved = true;
            }

            const deltaX = e.clientX - previousMousePosition.x;
            cameraAngle -= deltaX * 0.007;

            updateCameraPosition();
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointerup', (e) => {
            if (!isDragging) return;
            isDragging = false;

            if (!hasMoved) {
                if (e.target.closest('.interactive') || e.target.closest('header') || e.target.closest('.toolbar')) {
                    return;
                }

                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(ground);

                if (intersects.length > 0) {
                    const intersect = intersects[0];

                    if (currentTool === 'eraser') {
                        if (placedObjects.length > 0) {
                            let closestObj = null;
                            let minDist = 1.2;
                            let closestIndex = -1;

                            placedObjects.forEach((item, idx) => {
                                const dist = item.mesh.position.distanceTo(intersect.point);
                                if (dist < minDist) {
                                    minDist = dist;
                                    closestObj = item;
                                    closestIndex = idx;
                                }
                            });

                            if (closestObj) {
                                scene.remove(closestObj.mesh);
                                placedObjects.splice(closestIndex, 1);
                                saveGame();
                            }
                        }
                    } else {
                        // Проверка на наложение объектов
                        let tooClose = false;
                        placedObjects.forEach(item => {
                            if (item.mesh.position.distanceTo(intersect.point) < 1.0) {
                                tooClose = true;
                            }
                        });

                        if (!tooClose) {
                            const model = createModel(currentTool);
                            model.position.set(intersect.point.x, 0, intersect.point.z);
                            scene.add(model);
                            placedObjects.push({ type: currentTool, mesh: model });
                            saveGame();
                        }
                    }
                }
            }
        });

        // Плавный зум (приближение и отдаление колесиком / жестами)
        window.addEventListener('wheel', (e) => {
            cameraRadius += e.deltaY * 0.03;
            // Ограничения приближения и отдаления
            if (cameraRadius < 10) cameraRadius = 10;
            if (cameraRadius > 45) cameraRadius = 45;

            // Синхронизируем высоту с радиусом для красивого угла обзора
            cameraHeight = cameraRadius * 0.9;
            updateCameraPosition();
        }, { passive: true });

        // Поддержка жестов Pinch (зум двумя пальцами на мобильных устройствах)
        let initialTouchDist = 0;
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                initialTouchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                const currentDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const diff = initialTouchDist - currentDist;
                cameraRadius += diff * 0.05;
                if (cameraRadius < 10) cameraRadius = 10;
                if (cameraRadius > 45) cameraRadius = 45;

                cameraHeight = cameraRadius * 0.9;
                updateCameraPosition();
                initialTouchDist = currentDist;
            }
        });

        // Загружаем сохраненный мир при старте
        loadGame();

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
