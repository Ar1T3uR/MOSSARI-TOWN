<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mossari Town</title>
    <!-- Подключаем официальный скрипт Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1a1a24;
            color: #ffffff;
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            z-index: 1;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 20px;
            z-index: 10;
        }

        .interactive {
            pointer-events: auto;
        }

        header {
            background: rgba(20, 20, 28, 0.85);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .brand-logo {
            font-weight: 800;
            letter-spacing: 2px;
            font-size: 16px;
            text-transform: uppercase;
        }

        .brand-logo span {
            color: #c5a059;
        }

        .user-info {
            font-size: 13px;
            font-weight: 600;
            color: #c5a059;
            background: rgba(197, 160, 89, 0.15);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(197, 160, 89, 0.3);
        }

        .bottom-ui {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .sub-menu {
            display: none;
            background: rgba(20, 20, 28, 0.95);
            backdrop-filter: blur(12px);
            padding: 8px;
            border-radius: 16px;
            gap: 8px;
            border: 1px solid rgba(197, 160, 89, 0.3);
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }

        .sub-menu.active {
            display: flex;
        }

        .toolbar {
            background: rgba(20, 20, 28, 0.85);
            backdrop-filter: blur(12px);
            padding: 10px 14px;
            border-radius: 20px;
            display: flex;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.08);
            max-width: 480px;
            margin: 0 auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            overflow-x: auto;
        }

        .tool-btn {
            background: rgba(255,255,255,0.04);
            border: 2px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 8px 8px;
            flex: 1;
            min-width: 65px;
            text-align: center;
            cursor: pointer;
            color: white;
            transition: all 0.2s;
            font-size: 10px;
            font-weight: 600;
        }

        .tool-btn.active {
            border-color: #c5a059;
            background: rgba(197, 160, 89, 0.2);
            transform: translateY(-2px);
        }

        .tool-btn .icon {
            font-size: 18px;
            display: block;
            margin-bottom: 3px;
        }

        /* Кнопки зума справа сбоку */
        .zoom-controls {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 20;
        }

        .zoom-btn {
            width: 48px;
            height: 48px;
            background: rgba(20, 20, 28, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        .instruction {
            text-align: center;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 12px;
            margin-bottom: 6px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.05);
        }
    </style>

    <!-- Подключаем Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- Кнопки зума справа сбоку -->
    <div class="zoom-controls interactive">
        <div class="zoom-btn" onclick="zoomIn()">+</div>
        <div class="zoom-btn" onclick="zoomOut()">−</div>
    </div>

    <div class="ui-layer">
        <header class="interactive">
            <div class="brand-logo">mossari <span>town</span></div>
            <div class="user-info" id="username">Гость</div>
        </header>

        <div class="bottom-ui">
            <div class="instruction">Двигайте карту пальцем. Ставьте дома, ТЦ, деревья и заборы!</div>
            
            <!-- Выпадающее подменю для 4 вариантов заборов -->
            <div id="fenceSubMenu" class="sub-menu interactive">
                <div class="tool-btn" id="btn_fence_wood" onclick="selectFence('fence_wood')">
                    <span class="icon">🪵</span>Дерево
                </div>
                <div class="tool-btn" id="btn_fence_stone" onclick="selectFence('fence_stone')">
                    <span class="icon">🏛️</span>Бордюр
                </div>
                <div class="tool-btn" id="btn_fence_hedge" onclick="selectFence('fence_hedge')">
                    <span class="icon">🌿</span>Изгородь
                </div>
                <div class="tool-btn" id="btn_fence_mossari" onclick="selectFence('fence_mossari')">
                    <span class="icon">✨</span>Mossari
                </div>
            </div>

            <!-- Главная панель инструментов -->
            <div class="toolbar interactive">
                <div class="tool-btn active" id="btn_house" onclick="setTool('house')">
                    <span class="icon">🏠</span>Дом
                </div>
                <div class="tool-btn" id="btn_mall" onclick="setTool('mall')">
                    <span class="icon">🏬</span>ТЦ
                </div>
                <div class="tool-btn" id="btn_tree" onclick="setTool('tree')">
                    <span class="icon">🌲</span>Дерево
                </div>
                <div class="tool-btn" id="btn_fence_main" onclick="toggleFenceMenu()">
                    <span class="icon">🚧</span>Забор
                </div>
                <div class="tool-btn" id="btn_eraser" onclick="setTool('eraser')">
                    <span class="icon">❌</span>Удалить
                </div>
            </div>
        </div>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        try {
            tg.expand();
        } catch(e) {}

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('username').innerText = user.first_name || 'Житель';
        }

        let currentTool = 'house';

        function toggleFenceMenu() {
            const subMenu = document.getElementById('fenceSubMenu');
            subMenu.classList.toggle('active');
        }

        function selectFence(fenceType) {
            setTool(fenceType);
            const icons = {
                'fence_wood': '🪵',
                'fence_stone': '🏛️',
                'fence_hedge': '🌿',
                'fence_mossari': '✨'
            };
            document.getElementById('btn_fence_main').querySelector('.icon').innerText = icons[fenceType];
            document.getElementById('fenceSubMenu').classList.remove('active');
        }

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            
            if (tool.startsWith('fence_')) {
                document.getElementById('btn_fence_main').classList.add('active');
                const btn = document.getElementById('btn_' + tool);
                if (btn) btn.classList.add('active');
            } else {
                const btn = document.getElementById('btn_' + tool);
                if (btn) btn.classList.add('active');
                document.getElementById('fenceSubMenu').classList.remove('active');
            }
        }

        // --- 3D МИР (Three.js) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x12121a);

        const width = window.innerWidth || 800;
        const height = window.innerHeight || 600;

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        
        let cameraRadius = 28;
        let cameraAngle = 0;
        let cameraHeight = 25;
        const targetCenter = new THREE.Vector3(0, 0, 0);

        function updateCameraPosition() {
            camera.position.x = targetCenter.x + Math.sin(cameraAngle) * cameraRadius;
            camera.position.z = targetCenter.z + Math.cos(cameraAngle) * cameraRadius;
            camera.position.y = cameraHeight;
            camera.lookAt(targetCenter);
        }
        updateCameraPosition();

        function zoomIn() {
            cameraRadius -= 3;
            if (cameraRadius < 8) cameraRadius = 8;
            cameraHeight = cameraRadius * 0.9;
            updateCameraPosition();
        }

        function zoomOut() {
            cameraRadius += 3;
            if (cameraRadius > 48) cameraRadius = 48;
            cameraHeight = cameraRadius * 0.9;
            updateCameraPosition();
        }

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfff5e6, 0.9);
        dirLight.position.set(25, 35, 25);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Лужайка
        const groundGeo = new THREE.PlaneGeometry(50, 50);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x24342b, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const placedObjects = [];

        function createModel(type) {
            const group = new THREE.Group();

            if (type === 'house') {
                const baseMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.2 });
                const base = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.1, 1.4), baseMat);
                base.position.y = 0.55;
                base.castShadow = true;
                group.add(base);

                const roofMat = new THREE.MeshStandardMaterial({ color: 0xc84b31, roughness: 0.4 });
                const roof = new THREE.Mesh(new THREE.ConeGeometry(1.1, 0.9, 4), roofMat);
                roof.position.y = 1.55;
                roof.rotation.y = Math.PI / 4;
                roof.castShadow = true;
                group.add(roof);

                const door = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.55, 0.05), new THREE.MeshStandardMaterial({ color: 0x5a3d28 }));
                door.position.set(0, 0.28, 0.71);
                group.add(door);

                const winMat = new THREE.MeshStandardMaterial({ color: 0x33b5e5, roughness: 0.1 });
                const win1 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.05), winMat);
                win1.position.set(-0.38, 0.7, 0.71);
                group.add(win1);

                const win2 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.05), winMat);
                win2.position.set(0.38, 0.7, 0.71);
                group.add(win2);
            } 
            else if (type === 'mall') {
                const body = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.6, 2.0), new THREE.MeshStandardMaterial({ color: 0x181820, roughness: 0.2 }));
                body.position.y = 0.8;
                body.castShadow = true;
                group.add(body);

                const glass = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.9, 2.05), new THREE.MeshStandardMaterial({ color: 0x4090b0, roughness: 0.1, transparent: true, opacity: 0.7 }));
                glass.position.y = 0.65;
                group.add(glass);

                const roof = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.15, 2.2), new THREE.MeshStandardMaterial({ color: 0xc5a059, metalness: 0.6, roughness: 0.2 }));
                roof.position.y = 1.67;
                roof.castShadow = true;
                group.add(roof);

                const topBox = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.4, 1.0), new THREE.MeshStandardMaterial({ color: 0x181820 }));
                topBox.position.set(0, 1.95, 0);
                group.add(topBox);

                const sign = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.12, 1.05), new THREE.MeshStandardMaterial({ color: 0xffd700 }));
                sign.position.set(0, 2.2, 0);
                group.add(sign);
            }
            else if (type === 'tree') {
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.15, 0.8), new THREE.MeshStandardMaterial({ color: 0x6e4727 }));
                trunk.position.y = 0.4;
                trunk.castShadow = true;
                group.add(trunk);

                const leavesMat1 = new THREE.MeshStandardMaterial({ color: 0x2e8b57, roughness: 0.7 });
                const leavesMat2 = new THREE.MeshStandardMaterial({ color: 0x3cb371, roughness: 0.7 });

                const leaf1 = new THREE.Mesh(new THREE.DodecahedronGeometry(0.65), leavesMat1);
                leaf1.position.y = 1.0;
                leaf1.castShadow = true;
                group.add(leaf1);

                const leaf2 = new THREE.Mesh(new THREE.DodecahedronGeometry(0.45), leavesMat2);
                leaf2.position.set(0.25, 1.25, 0.1);
                leaf2.castShadow = true;
                group.add(leaf2);

                const leaf3 = new THREE.Mesh(new THREE.DodecahedronGeometry(0.45), leavesMat2);
                leaf3.position.set(-0.2, 1.15, -0.2);
                leaf3.castShadow = true;
                group.add(leaf3);
            }
            else if (type.startsWith('fence_')) {
                const mat = type === 'fence_stone' ? new THREE.MeshStandardMaterial({ color: 0x707070 }) :
                            type === 'fence_hedge' ? new THREE.MeshStandardMaterial({ color: 0x2e6b3e }) :
                            type === 'fence_mossari' ? new THREE.MeshStandardMaterial({ color: 0x181818 }) :
                            new THREE.MeshStandardMaterial({ color: 0x8b5a2b });

                if (type === 'fence_wood') {
                    for (let i = -0.5; i <= 0.5; i += 0.35) {
                        const post = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.6, 0.1), mat);
                        post.position.set(i, 0.3, 0);
                        group.add(post);
                    }
                    group.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.08, 0.05), mat), { position: new THREE.Vector3(0, 0.45, 0) }));
                    group.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.08, 0.05), mat), { position: new THREE.Vector3(0, 0.15, 0) }));
                } else if (type === 'fence_stone' || type === 'fence_hedge') {
                    const geo = type === 'fence_stone' ? new THREE.BoxGeometry(1.2, 0.4, 0.3) : new THREE.BoxGeometry(1.2, 0.7, 0.4);
                    const obj = new THREE.Mesh(geo, mat);
                    obj.position.y = type === 'fence_stone' ? 0.2 : 0.35;
                    obj.castShadow = true;
                    group.add(obj);
                } else if (type === 'fence_mossari') {
                    const bar = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.5, 0.15), mat);
                    bar.position.y = 0.25;
                    group.add(bar);
                    const top = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.08, 0.2), new THREE.MeshStandardMaterial({ color: 0xc5a059, metalness: 0.7 }));
                    top.position.y = 0.52;
                    group.add(top);
                }
            }

            return group;
        }

        // --- СОХРАНЕНИЕ ---
        const SAVE_KEY = 'mossari_town_save_v4';

        function saveGame() {
            const dataToSave = placedObjects.map(item => ({
                type: item.type,
                x: item.mesh.position.x,
                z: item.mesh.position.z,
                rotY: item.mesh.rotation.y
            }));
            localStorage.setItem(SAVE_KEY, JSON.stringify(dataToSave));
        }

        function loadGame() {
            let savedData = localStorage.getItem(SAVE_KEY) || localStorage.getItem('mossari_town_save_v3');
            if (savedData) {
                try {
                    const parsed = JSON.parse(savedData);
                    parsed.forEach(data => {
                        let t = data.type;
                        if (t === 'fence') t = 'fence_wood';
                        const model = createModel(t);
                        model.position.set(data.x, 0, data.z);
                        if (data.rotY !== undefined) model.rotation.y = data.rotY;
                        scene.add(model);
                        placedObjects.push({ type: t, mesh: model });
                    });
                } catch(e) {}
            }
        }

        // --- УПРАВЛЕНИЕ И КЛИКИ ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        let isDragging = false;
        let hasMoved = false;
        let pointerDownPos = { x: 0, y: 0 };
        let previousMousePosition = { x: 0, y: 0 };

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.interactive') || e.target.closest('.zoom-controls')) return;
            isDragging = true;
            hasMoved = false;
            pointerDownPos = { x: e.clientX, y: e.clientY };
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;

            const dx = e.clientX - pointerDownPos.x;
            const dy = e.clientY - pointerDownPos.y;
            if (Math.sqrt(dx * dx + dy * dy) > 5) {
                hasMoved = true;
            }

            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            const panSpeed = 0.02 * (cameraRadius * 0.05);
            targetCenter.x -= (deltaX * Math.cos(cameraAngle) - deltaY * Math.sin(cameraAngle)) * panSpeed;
            targetCenter.z -= (deltaX * Math.sin(cameraAngle) + deltaY * Math.cos(cameraAngle)) * panSpeed;

            updateCameraPosition();
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointerup', (e) => {
            if (!isDragging) return;
            isDragging = false;

            if (!hasMoved) {
                if (e.target.closest('.interactive') || e.target.closest('header') || e.target.closest('.zoom-controls')) {
                    return;
                }

                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(ground);

                if (intersects.length > 0) {
                    const intersect = intersects[0];

                    if (currentTool === 'eraser') {
                        if (placedObjects.length > 0) {
                            let closestObj = null;
                            let minDist = 1.2;
                            let closestIndex = -1;

                            placedObjects.forEach((item, idx) => {
                                const dist = item.mesh.position.distanceTo(intersect.point);
                                if (dist < minDist) {
                                    minDist = dist;
                                    closestObj = item;
                                    closestIndex = idx;
                                }
                            });

                            if (closestObj) {
                                scene.remove(closestObj.mesh);
                                placedObjects.splice(closestIndex, 1);
                                saveGame();
                            }
                        }
                    } else {
                        let posX = intersect.point.x;
                        let posZ = intersect.point.z;
                        let snapRotation = 0;

                        if (currentTool.startsWith('fence_')) {
                            const step = 1.2;
                            const gridX = Math.round(posX / step) * step;
                            const gridZ = Math.round(posZ / step) * step;

                            let nearestFence = null;
                            let minD = 2.0;
                            placedObjects.forEach(item => {
                                if (item.type.startsWith('fence_')) {
                                    const d = item.mesh.position.distanceTo(new THREE.Vector3(gridX, 0, gridZ));
                                    if (d < minD) {
                                        minD = d;
                                        nearestFence = item;
                                    }
                                }
                            });

                            if (nearestFence) {
                                const dx = gridX - nearestFence.mesh.position.x;
                                const dz = gridZ - nearestFence.mesh.position.z;
                                if (Math.abs(dx) > Math.abs(dz)) {
                                    snapRotation = Math.PI / 2;
                                }
                            }
                            posX = gridX;
                            posZ = gridZ;
                        }

                        let tooClose = false;
                        placedObjects.forEach(item => {
                            const minDist = currentTool.startsWith('fence_') ? 0.8 : (currentTool === 'mall' ? 2.0 : 1.0);
                            if (item.mesh.position.distanceTo(new THREE.Vector3(posX, 0, posZ)) < minDist) {
                                tooClose = true;
                            }
                        });

                        if (!tooClose) {
                            const model = createModel(currentTool);
                            model.position.set(posX, 0, posZ);
                            if (currentTool.startsWith('fence_')) {
                                model.rotation.y = snapRotation;
                            }
                            scene.add(model);
                            placedObjects.push({ type: currentTool, mesh: model });
                            saveGame();
                        }
                    }
                }
            }
        });

        window.addEventListener('wheel', (e) => {
            cameraRadius += e.deltaY * 0.03;
            if (cameraRadius < 8) cameraRadius = 8;
            if (cameraRadius > 48) cameraRadius = 48;
            cameraHeight = cameraRadius * 0.9;
            updateCameraPosition();
        }, { passive: true });

        loadGame();

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
    </script>
</body>
</html>
